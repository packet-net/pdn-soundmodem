<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdn-soundmodem · waterfall</title>
<style>
  :root {
    --bg: #0a0d11;
    --panel: #11161d;
    --edge: #1e2632;
    --ink: #d9e2ea;
    --muted: #7c8894;
    --amber: #f5a83c;
    --amber-dim: #b97f2e;
    --trace: #56c8dd;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    --sans: system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  .wordmark { font-family: var(--mono); font-size: 14px; letter-spacing: .02em; white-space: nowrap; }
  .wordmark b { color: var(--amber); font-weight: 600; }
  .wordmark span { color: var(--muted); }

  .ctl { display: flex; flex-direction: column; gap: 2px; }
  .ctl label {
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .ctl-row { display: flex; align-items: center; gap: 6px; }

  #dial {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 18px; width: 128px; color: var(--amber);
    background: #0c1016; border: 1px solid var(--edge); border-radius: 3px;
    padding: 2px 7px; outline: none;
  }
  #dial:focus { border-color: var(--amber-dim); }
  #dial.unset { color: var(--muted); }
  .unit { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  .seg { display: flex; border: 1px solid var(--edge); border-radius: 3px; overflow: hidden; }
  .seg button {
    font-family: var(--mono); font-size: 12px; padding: 5px 10px; border: 0;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .seg button.on { background: #1a2330; color: var(--ink); }
  .seg button:focus-visible { outline: 2px solid var(--amber-dim); outline-offset: -2px; }

  select, .btn {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    background: #0c1016; border: 1px solid var(--edge); border-radius: 3px; padding: 5px 6px;
  }
  .btn { cursor: pointer; }
  .btn:hover { border-color: var(--amber-dim); }
  input[type=range] { width: 84px; accent-color: var(--amber-dim); }

  .spacer { flex: 1; }
  #meta { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; line-height: 1.5; }
  #meta .live { color: #7bd88f; }
  #meta .dead { color: #f27e7e; }

  #chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  .chip {
    display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px;
    border: 1px solid var(--edge); border-radius: 3px; padding: 3px 8px; color: var(--muted);
    white-space: nowrap;
  }
  .chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .chip b { color: var(--ink); font-weight: 500; }
  .chip .rf { color: var(--amber); }

  main { flex: 1; display: flex; min-height: 0; }
  #display { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #spec { width: 100%; height: 140px; display: block; }
  #ruler { width: 100%; height: 30px; display: block; }
  #wfwrap { flex: 1; position: relative; min-height: 0; }
  #wf, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #overlay { pointer-events: none; }

  #tip {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    background: rgba(12,16,22,.92); border: 1px solid var(--edge); border-radius: 3px;
    padding: 5px 8px; color: var(--ink); white-space: nowrap;
  }
  #tip .rf { color: var(--amber); }

  #log {
    width: 320px; border-left: 1px solid var(--edge); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #log h2 {
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    font-weight: 600; padding: 8px 12px 6px; border-bottom: 1px solid var(--edge);
  }
  #frames { flex: 1; overflow-y: auto; font-family: var(--mono); font-size: 11px; }
  .fr { padding: 5px 12px; border-bottom: 1px solid #141a23; line-height: 1.55; }
  .fr .t { color: var(--muted); }
  .fr .from { color: var(--amber); font-weight: 600; }
  .fr .arrow, .fr .to { color: var(--ink); }
  .fr .d { color: var(--muted); }
  .fr .d i { font-style: normal; }
  .fr .bad { color: #f27e7e; }
  #frames .empty { padding: 14px 12px; color: var(--muted); font-family: var(--sans); font-size: 12px; }

  @media (max-width: 900px) { #log { display: none; } }
</style>
</head>
<body>
<header>
  <div class="wordmark"><b>pdn-soundmodem</b> <span>waterfall</span></div>

  <div class="ctl">
    <label for="dial">Dial · MHz</label>
    <div class="ctl-row">
      <input id="dial" inputmode="decimal" spellcheck="false" placeholder="—">
      <div class="seg" id="sideband">
        <button data-sb="usb">USB</button><button data-sb="lsb">LSB</button>
      </div>
    </div>
  </div>

  <div class="ctl">
    <label for="span">Span</label>
    <div class="ctl-row"><select id="span"></select></div>
  </div>

  <div class="ctl">
    <label>Level · dBFS</label>
    <div class="ctl-row">
      <input type="range" id="floor" min="-100" max="-45" step="1" title="Floor">
      <input type="range" id="top" min="-60" max="0" step="1" title="Top">
      <button class="btn" id="auto" title="Set floor and top from the current spectrum">Auto</button>
    </div>
  </div>

  <div class="spacer"></div>
  <div id="meta"><span id="conn" class="dead">connecting…</span><br><span id="stats"></span></div>
</header>

<div id="chips"></div>

<main>
  <div id="display">
    <canvas id="spec"></canvas>
    <canvas id="ruler"></canvas>
    <div id="wfwrap">
      <canvas id="wf"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </div>
  <aside id="log">
    <h2>Decoded frames</h2>
    <div id="frames"><div class="empty">Nothing decoded yet. Frames appear here and as tags on the waterfall.</div></div>
  </aside>
</main>
<div id="tip"></div>

<script>
"use strict";

/* ---------- persisted UI state ---------- */
const LS = "pdnsm-waterfall";
const ui = Object.assign(
  { dialHz: null, sideband: null, spanHz: 3000, floorDb: -95, topDb: -35 },
  JSON.parse(localStorage.getItem(LS) || "{}"));
const save = () => localStorage.setItem(LS, JSON.stringify(ui));

/* ---------- config from the server (arrives on the socket) ---------- */
let cfg = null;              // {sampleRate, binWidthHz, lineLength, linesPerSecond, dialHz, sideband, modems[]}
let lastLine = -1;           // index of the newest drawn line
let lastBins = null;         // newest raw line (Uint8Array)
let smooth = null;           // smoothed spectrum (Float32Array, dB)
let peaks = null;            // decaying peak-hold (Float32Array, dB)
let lastLineAt = 0;          // wall-clock ms of the newest line
let fpsCount = 0, fpsShown = 0;

// Categorical identity hues for modem markers, fixed order, validated (OKLCH dark band,
// CVD + normal-vision ΔE, ≥3:1 on the surface) — identity is never color-alone: every
// marker ships with its sub-channel + mode text.
const MODEM_HUES = ["#2599bb", "#43a54e", "#8f72e6", "#d45a7d"];
const hueFor = i => MODEM_HUES[i % MODEM_HUES.length];

const $ = id => document.getElementById(id);
const dpr = () => window.devicePixelRatio || 1;

/* ---------- inferno colormap (lightness-monotonic; anchors every 1/15th) ---------- */
const INFERNO = [[0,0,4],[12,8,38],[36,12,79],[66,10,104],[93,18,110],[120,28,109],
  [147,38,103],[174,48,92],[199,62,76],[221,81,58],[237,105,37],[248,133,15],
  [252,165,10],[250,197,39],[242,230,97],[252,255,164]];
const LUT = new Uint8Array(256 * 3);
for (let i = 0; i < 256; i++) {
  const x = i / 255 * (INFERNO.length - 1), a = Math.floor(x), f = x - a;
  const c0 = INFERNO[a], c1 = INFERNO[Math.min(a + 1, INFERNO.length - 1)];
  for (let k = 0; k < 3; k++) LUT[i * 3 + k] = c0[k] + (c1[k] - c0[k]) * f;
}

/* ---------- byte <-> dB (must match WaterfallSource: 0 => -100 dBFS, 255 => 0) ---------- */
const FLOOR_DB = -100;
const byteToDb = b => FLOOR_DB + b * (-FLOOR_DB / 255);
const norm = db => Math.min(1, Math.max(0, (db - ui.floorDb) / (ui.topDb - ui.floorDb)));

/* ---------- derived frequency helpers ---------- */
const nyquist = () => cfg.sampleRate / 2;
const spanHz = () => Math.min(ui.spanHz, nyquist());
const binsInSpan = () => Math.min(cfg.lineLength, Math.round(spanHz() / cfg.binWidthHz));
const afToX = (af, w) => af / spanHz() * w;
const dialSet = () => ui.dialHz != null && ui.dialHz > 0;
const rfAt = af => ui.sideband === "lsb" ? ui.dialHz - af : ui.dialHz + af;
const fmtRfKhz = af => (rfAt(af) / 1000).toFixed(2);
// Six decimals is Hz precision on MHz; trailing zeros are noise on a dial you would read as
// 7.0516. toFixed(5) was both coarser than the modems are placed and left a stray zero.
const fmtRfMhz = af => (rfAt(af) / 1e6).toFixed(6).replace(/0+$/, "").replace(/\.$/, "");

/* ---------- canvases ---------- */
const spec = $("spec"), ruler = $("ruler"), wf = $("wf"), overlay = $("overlay");
const sctx = spec.getContext("2d"), rctx = ruler.getContext("2d");
const wctx = wf.getContext("2d"), octx = overlay.getContext("2d");
const rowCanvas = document.createElement("canvas");
rowCanvas.height = 1;
const rowCtx = rowCanvas.getContext("2d");
// Waterfall history lives in a ring canvas: rows are written at a descending write head
// and presented with two blits (no self-copying drawImage, no per-line full-canvas move).
const ring = document.createElement("canvas");
const gctx = ring.getContext("2d");
let head = 0;

function sizeCanvas(c) {
  const r = c.getBoundingClientRect(), d = dpr();
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return true; }
  return false;
}

function resizeAll() {
  sizeCanvas(spec); sizeCanvas(ruler); sizeCanvas(overlay);
  if (sizeCanvas(wf) || ring.width !== wf.width) {
    ring.width = wf.width; ring.height = Math.max(1, wf.height);
    gctx.fillStyle = "#000"; gctx.fillRect(0, 0, ring.width, ring.height);
    head = 0;
    wctx.fillStyle = "#000"; wctx.fillRect(0, 0, wf.width, wf.height);
  }
  if (cfg) { drawRuler(); drawOverlay(); }
}
new ResizeObserver(resizeAll).observe($("wfwrap"));
window.addEventListener("resize", resizeAll);

/* ---------- header controls ---------- */
function initControls() {
  if (ui.dialHz == null && cfg.dialHz > 0) ui.dialHz = cfg.dialHz;
  if (ui.sideband == null) ui.sideband = (cfg.sideband || "usb").toLowerCase();

  const dial = $("dial");
  const showDial = () => {
    dial.value = dialSet() ? (ui.dialHz / 1e6).toFixed(6) : "";
    dial.classList.toggle("unset", !dialSet());
  };
  showDial();
  dial.addEventListener("change", () => {
    const mhz = parseFloat(dial.value);
    ui.dialHz = isFinite(mhz) && mhz > 0 ? Math.round(mhz * 1e6) : null;
    save(); showDial(); drawRuler(); drawOverlay(); renderChips();
  });

  const sb = $("sideband");
  const showSb = () => sb.querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", b.dataset.sb === ui.sideband));
  showSb();
  sb.addEventListener("click", e => {
    if (!e.target.dataset.sb) return;
    ui.sideband = e.target.dataset.sb;
    save(); showSb(); drawRuler(); drawOverlay(); renderChips();
  });

  const span = $("span");
  span.replaceChildren(...[2000, 2500, 3000, 4000, 6000, 12000, 24000]
    .filter(s => s <= nyquist())
    .map(s => new Option(s < 1000 * 10 ? (s / 1000) + " kHz" : (s / 1000) + " kHz", s)));
  if (![...span.options].some(o => +o.value === ui.spanHz)) ui.spanHz = 3000;
  span.value = ui.spanHz;
  span.addEventListener("change", () => {
    ui.spanHz = +span.value; save();
    gctx.fillStyle = "#000"; gctx.fillRect(0, 0, ring.width, ring.height);
    head = 0; presentWaterfall();
    drawRuler(); drawOverlay();
  });

  $("floor").value = ui.floorDb;
  $("top").value = ui.topDb;
  $("floor").addEventListener("input", () => { ui.floorDb = Math.min(+$("floor").value, ui.topDb - 5); save(); });
  $("top").addEventListener("input", () => { ui.topDb = Math.max(+$("top").value, ui.floorDb + 5); save(); });
  $("auto").addEventListener("click", () => {
    if (!lastBins) return;
    const sorted = [...lastBins.slice(0, binsInSpan())].sort((a, b) => a - b);
    ui.floorDb = Math.round(byteToDb(sorted[Math.floor(sorted.length * 0.25)]) - 3);
    ui.topDb = Math.round(Math.min(0, byteToDb(sorted[sorted.length - 1]) + 12));
    if (ui.topDb - ui.floorDb < 20) ui.topDb = ui.floorDb + 20;
    $("floor").value = ui.floorDb; $("top").value = ui.topDb; save();
  });
}

function renderChips() {
  $("chips").replaceChildren(...cfg.modems.map((m, i) => {
    const chip = document.createElement("div");
    chip.className = "chip";
    const rf = dialSet() ? ` <span class="rf">${fmtRfMhz(m.centreHz)}</span>` : "";
    chip.innerHTML = `<i style="background:${hueFor(i)}"></i>` +
      `<span><b>${m.sub} · ${m.modeName || m.mode}</b> ${Math.round(m.centreHz)} Hz${rf}</span>`;
    chip.title = `${m.mode}\nband ${Math.round(m.lowHz)}–${Math.round(m.highHz)} Hz`;
    return chip;
  }));
}

/* ---------- ruler: RF (amber, from dial ± AF) above AF (muted) ---------- */
function tickStep() {
  const s = spanHz();
  return s <= 2500 ? 250 : s <= 6000 ? 500 : s <= 12000 ? 1000 : 2000;
}

function drawRuler() {
  const d = dpr(), w = ruler.width, h = ruler.height;
  rctx.fillStyle = "#0c1016"; rctx.fillRect(0, 0, w, h);
  rctx.strokeStyle = "#1e2632"; rctx.lineWidth = 1;
  rctx.strokeRect(0.5, 0.5, w - 1, h - 1);
  rctx.textBaseline = "middle";
  const step = tickStep();
  for (let af = 0; af <= spanHz(); af += step) {
    const x = Math.round(afToX(af, w)) + 0.5;
    rctx.strokeStyle = "rgba(255,255,255,.25)";
    rctx.beginPath(); rctx.moveTo(x, h - 6 * d); rctx.lineTo(x, h); rctx.stroke();
    rctx.font = `${10 * d}px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
    rctx.textAlign = af === 0 ? "left" : "center";
    rctx.fillStyle = "#7c8894";
    rctx.fillText(af >= 1000 ? (af / 1000) + "k" : af + "", x + (af === 0 ? 2 : 0), h - 8 * d);
    if (dialSet()) {
      rctx.fillStyle = "#f5a83c";
      rctx.fillText(fmtRfKhz(af), x + (af === 0 ? 2 : 0), h * 0.30);
    }
  }
  if (!dialSet()) {
    rctx.fillStyle = "#4c5560"; rctx.textAlign = "left";
    rctx.font = `${9 * d}px ${getComputedStyle(document.body).getPropertyValue("--sans")}`;
    rctx.fillText("Set the dial frequency to see RF", 6 * d, h * 0.30);
  }
}

/* ---------- modem overlay on the waterfall (band tint + centre line) ---------- */
function drawOverlay() {
  const w = overlay.width, h = overlay.height;
  octx.clearRect(0, 0, w, h);
  cfg.modems.forEach((m, i) => {
    const x0 = afToX(m.lowHz, w), x1 = afToX(m.highHz, w), xc = afToX(m.centreHz, w);
    if (x0 > w) return;
    octx.fillStyle = hueFor(i) + "14";
    octx.fillRect(x0, 0, x1 - x0, h);
    octx.strokeStyle = hueFor(i) + "50"; octx.lineWidth = 1;
    octx.beginPath(); octx.moveTo(Math.round(x0) + .5, 0); octx.lineTo(Math.round(x0) + .5, h); octx.stroke();
    octx.beginPath(); octx.moveTo(Math.round(x1) + .5, 0); octx.lineTo(Math.round(x1) + .5, h); octx.stroke();
    octx.strokeStyle = hueFor(i) + "a0";
    octx.setLineDash([4, 6]);
    octx.beginPath(); octx.moveTo(Math.round(xc) + .5, 0); octx.lineTo(Math.round(xc) + .5, h); octx.stroke();
    octx.setLineDash([]);
  });
}

/* ---------- spectrum panel ---------- */
function drawSpectrum() {
  const d = dpr(), w = spec.width, h = spec.height;
  sctx.fillStyle = "#0a0d11"; sctx.fillRect(0, 0, w, h);

  // recessive dB grid every 20 dB of the displayed window
  sctx.strokeStyle = "rgba(255,255,255,.05)"; sctx.lineWidth = 1;
  sctx.fillStyle = "#4c5560";
  sctx.font = `${9 * d}px ui-monospace, monospace`;
  sctx.textAlign = "left"; sctx.textBaseline = "top";
  for (let db = Math.ceil(ui.floorDb / 20) * 20; db <= ui.topDb; db += 20) {
    const y = Math.round(h - norm(db) * h) + .5;
    sctx.beginPath(); sctx.moveTo(0, y); sctx.lineTo(w, y); sctx.stroke();
    sctx.fillText(db + "", 4 * d, y + 2 * d);
  }

  // modem bands (identity tint + centre), quiet behind the trace
  cfg.modems.forEach((m, i) => {
    const x0 = afToX(m.lowHz, w), x1 = afToX(m.highHz, w), xc = afToX(m.centreHz, w);
    sctx.fillStyle = hueFor(i) + "10";
    sctx.fillRect(x0, 0, x1 - x0, h);
    sctx.strokeStyle = hueFor(i) + "66";
    sctx.setLineDash([3, 5]);
    sctx.beginPath(); sctx.moveTo(Math.round(xc) + .5, 0); sctx.lineTo(Math.round(xc) + .5, h); sctx.stroke();
    sctx.setLineDash([]);
    sctx.font = `${10 * d}px ui-monospace, monospace`;
    sctx.textAlign = "center"; sctx.textBaseline = "top";
    sctx.lineWidth = 3 * d; sctx.strokeStyle = "rgba(10,13,17,.9)";
    sctx.strokeText(`${m.sub}·${m.modeName || m.mode}`, xc, 3 * d);
    sctx.fillStyle = hueFor(i) + "cc";
    sctx.fillText(`${m.sub}·${m.modeName || m.mode}`, xc, 3 * d);
  });

  if (!smooth) return;
  const n = binsInSpan();

  // decaying peak-hold, faint
  sctx.strokeStyle = "rgba(245,168,60,.28)"; sctx.lineWidth = d;
  sctx.beginPath();
  for (let b = 0; b < n; b++) {
    const x = b / n * w, y = h - norm(peaks[b]) * h;
    b ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
  }
  sctx.stroke();

  // live trace
  sctx.strokeStyle = "#56c8dd"; sctx.lineWidth = 1.6 * d;
  sctx.lineJoin = "round";
  sctx.beginPath();
  for (let b = 0; b < n; b++) {
    const x = b / n * w, y = h - norm(smooth[b]) * h;
    b ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
  }
  sctx.stroke();
}

/* ---------- waterfall ---------- */
function drawWaterfallLine(bins) {
  const d = dpr(), w = ring.width, h = ring.height, rowH = Math.max(1, Math.round(d));
  // write the new row at the descending head; the ring holds one screen of history
  head = (head - rowH + h) % h;
  const n = binsInSpan();
  if (rowCanvas.width !== n) rowCanvas.width = n;
  const img = rowCtx.createImageData(n, 1);
  for (let b = 0; b < n; b++) {
    const v = Math.round(norm(byteToDb(bins[b])) * 255) * 3;
    img.data[b * 4] = LUT[v]; img.data[b * 4 + 1] = LUT[v + 1];
    img.data[b * 4 + 2] = LUT[v + 2]; img.data[b * 4 + 3] = 255;
  }
  rowCtx.putImageData(img, 0, 0);
  gctx.imageSmoothingEnabled = true;
  for (let r = 0; r < rowH; r++) gctx.drawImage(rowCanvas, 0, 0, n, 1, 0, head + r, w, 1);
  presentWaterfall();
}

function presentWaterfall() {
  const w = wf.width, h = wf.height;
  // newest row (ring y = head) lands at the top; two blits cover the wrap
  wctx.drawImage(ring, 0, head, w, ring.height - head, 0, 0, w, ring.height - head);
  if (head > 0) wctx.drawImage(ring, 0, 0, w, head, 0, ring.height - head, w, head);
}

/* ---------- per-frame burst tags: the callsign written onto the energy ---------- */
function tagFrame(ev) {
  const d = dpr(), w = ring.width, h = ring.height, rowH = Math.max(1, Math.round(d));
  const modemIndex = cfg.modems.findIndex(m => m.sub === ev.sub);
  const m = cfg.modems[modemIndex];
  if (!m) return;
  const rowsAgo = Math.max(0, lastLine - ev.line);
  const xBand = afToX(m.highHz, w) + 3 * d;
  const len = Math.max(rowH * 4, (ev.burstLines || 0) * rowH);
  const hue = hueFor(modemIndex);

  const parts = [ev.from || ev.mode];
  if (ev.snrDb != null) parts.push(ev.snrDb.toFixed(1) + " dB");
  if (ev.offsetHz != null) parts.push((ev.offsetHz >= 0 ? "+" : "") + ev.offsetHz.toFixed(0) + " Hz");
  const text = parts.join(" · ");

  // The tag is written into the ring (so it scrolls with the energy it names); a second
  // pass one ring-height up paints whatever the first clipped at the wrap seam.
  const ringY = (head + rowsAgo * rowH) % h;
  for (const yBase of [ringY, ringY - h]) {
    const y = yBase + 2 * d;
    gctx.strokeStyle = hue; gctx.lineWidth = d;
    gctx.beginPath();
    gctx.moveTo(xBand + 3 * d, y); gctx.lineTo(xBand, y);
    gctx.lineTo(xBand, y + len); gctx.lineTo(xBand + 3 * d, y + len);
    gctx.stroke();
    gctx.font = `${11 * d}px ui-monospace, monospace`;
    gctx.textAlign = "left"; gctx.textBaseline = "top";
    const tx = xBand + 6 * d, ty = y + 2 * d;
    gctx.lineWidth = 3 * d; gctx.strokeStyle = "rgba(0,0,0,.85)";
    gctx.strokeText(text, tx, ty);
    gctx.fillStyle = ev.from ? "#ffd9a0" : "#aab6c2";
    gctx.fillText(text, tx, ty);
  }

  presentWaterfall();
}

/* ---------- decode log panel ---------- */
let logEmpty = true;
function logFrame(ev) {
  if (logEmpty) { $("frames").replaceChildren(); logEmpty = false; }
  const row = document.createElement("div");
  row.className = "fr";
  const t = new Date().toTimeString().slice(0, 8);
  const who = ev.from
    ? `<span class="from">${ev.from}</span><span class="arrow">›</span><span class="to">${ev.to || "?"}</span>`
    : `<span class="to">unattributed</span>`;
  const bits = [];
  bits.push(`${ev.sub}·${ev.mode}`);
  if (ev.snrDb != null) bits.push(`<i>${ev.snrDb.toFixed(1)} dB</i>`);
  if (ev.offsetHz != null) bits.push(`<i>${ev.offsetHz >= 0 ? "+" : ""}${ev.offsetHz.toFixed(0)} Hz</i>`);
  bits.push(`${ev.lenBytes} B`);
  if (ev.corrected > 0) bits.push(`<i>fec ${ev.corrected}</i>`);
  if (ev.crc === false) bits.push(`<span class="bad">crc✗</span>`);
  row.innerHTML = `<span class="t">${t}</span> ${who}<br><span class="d">${bits.join(" · ")}</span>`;
  const list = $("frames");
  list.prepend(row);
  while (list.children.length > 100) list.lastChild.remove();
}

/* ---------- hover readout ---------- */
const tip = $("tip");
function hookHover(el) {
  el.addEventListener("mousemove", e => {
    if (!cfg) return;
    const r = $("display").getBoundingClientRect();
    const af = (e.clientX - r.left) / r.width * spanHz();
    let db = "";
    if (lastBins) {
      const b = Math.min(binsInSpan() - 1, Math.round(af / cfg.binWidthHz));
      db = ` · ${byteToDb(lastBins[b]).toFixed(0)} dB`;
    }
    tip.innerHTML = `AF ${Math.round(af)} Hz${db}` +
      (dialSet() ? `<br><span class="rf">RF ${fmtRfMhz(af)} MHz</span>` : "");
    tip.style.display = "block";
    tip.style.left = Math.min(window.innerWidth - 170, e.clientX + 14) + "px";
    tip.style.top = (e.clientY + 14) + "px";
  });
  el.addEventListener("mouseleave", () => tip.style.display = "none");
}
hookHover(spec); hookHover(wf);

/* ---------- socket ---------- */
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("conn").textContent = "live"; $("conn").className = "live"; };
  ws.onclose = () => {
    $("conn").textContent = "reconnecting…"; $("conn").className = "dead";
    setTimeout(connect, 2000);
  };
  ws.onmessage = e => {
    if (typeof e.data === "string") {
      const msg = JSON.parse(e.data);
      if (msg.type === "config") {
        const first = !cfg;
        cfg = msg;
        if (first) { initControls(); }
        renderChips(); resizeAll(); drawRuler(); drawOverlay();
      } else if (msg.type === "frame") {
        tagFrame(msg); logFrame(msg);
      }
      return;
    }
    const bytes = new Uint8Array(e.data);
    if (bytes[0] !== 0x01 || !cfg) return;
    lastLine = new DataView(e.data).getUint32(1, true);
    const bins = bytes.subarray(5);
    lastBins = bins;
    lastLineAt = performance.now();
    fpsCount++;
    const n = cfg.lineLength;
    if (!smooth || smooth.length !== n) {
      smooth = new Float32Array(n); peaks = new Float32Array(n);
      for (let b = 0; b < n; b++) smooth[b] = peaks[b] = byteToDb(bins[b]);
    }
    for (let b = 0; b < n; b++) {
      const db = byteToDb(bins[b]);
      smooth[b] += (db - smooth[b]) * 0.35;
      peaks[b] = db > peaks[b] ? db : peaks[b] - 0.15;
    }
    drawWaterfallLine(bins);
    drawSpectrum();
  };
}
connect();

/* status line: measured fps + resolution, and an honest "no audio" while the
   channel transmits or the device is quiet (half-duplex hears nothing then) */
setInterval(() => {
  fpsShown = fpsCount; fpsCount = 0;
  if (!cfg) return;
  const stale = performance.now() - lastLineAt > 1500;
  $("stats").textContent = stale
    ? "no audio (transmitting?)"
    : `${fpsShown} fps · ${cfg.binWidthHz.toFixed(1)} Hz/bin`;
}, 1000);
</script>
</body>
