  // The reference page's sentences are markdown: code spans and links, nothing else.
  function markdown(target, text) {
    var re = /`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/g, last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) target.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1] !== undefined) {
        target.appendChild(el("code", null, m[1]));
      } else {
        var a = el("a");
        markdown(a, m[2]);
        var href = m[3];
        a.href = /^https?:/.test(href) ? href : href.charAt(0) === "#" ? DOCS + "config.md" + href : new URL(href, DOCS).href;
        a.target = "_blank";
        a.rel = "noopener";
        target.appendChild(a);
      }
      last = re.lastIndex;
    }
    if (last < text.length) target.appendChild(document.createTextNode(text.slice(last)));
  }

  function help(k) {
    var h = el("div", "help");
    if (k.help) markdown(h, k.help);
    var d = k.docDefault !== undefined && k.docDefault !== "" ? k.docDefault
      : k.default !== undefined && k.default !== null ? "`" + JSON.stringify(k.default) + "`" : "";
    // The reference writes "absent: `device`" for "when the key is not there, device".
    if (d && d !== "absent") {
      var absent = /^absent(?:: |; )(.*)$/.exec(d);
      var span = el("span", "dflt", (k.help ? " " : "") + (absent ? "If not set: " : "Default: "));
      h.appendChild(span);
      markdown(span, absent ? absent[1] : d);
    }
    return h;
  }

  function drawNode(n) {
    switch (n.node) {
      case "field": return drawField(n);
      case "section": return drawSection(n);
      case "list": return n.path === "modems" ? drawModems(n) : drawList(n);
      case "unknown": {
        var u = el("div", "unknown");
        u.textContent = "Not settings this version knows, kept as they are: " + n.names.join(", ")
          + ". Edit as text shows them.";
        return u;
      }
      default: return el("div", "unknown", n.path + ": this page cannot draw a " + n.key.kind + "; use Edit as text");
    }
  }

  // The children of a section or list entry: plain fields, then sections, then the advanced ones
  // behind "More".
  function fillBody(body, nodes, path) {
    var shown = nodes.filter(function (n) { return n.shown; });
    var basic = shown.filter(function (n) { return !n.key || !n.key.advanced; });
    var more = shown.filter(function (n) { return n.key && n.key.advanced; });
    basic.forEach(function (n) { body.appendChild(drawNode(n)); });
    if (more.length > 0) {
      var d = el("details", "more");
      d.dataset.path = "more:" + path;
      if (moreOpen["more:" + path]) d.open = true;
      d.appendChild(el("summary", null, "More"));
      var inner = el("div", "inner");
      more.forEach(function (n) { inner.appendChild(drawNode(n)); });
      d.appendChild(inner);
      body.appendChild(d);
    }
  }

  function sectionHead(card, n, title, buttons) {
    var head = el("div", "head");
    head.appendChild(el("span", "name", title));
    if (n) { var kn = el("code", null, M.docPath(n.path)); head.appendChild(kn); }
    head.appendChild(el("span", "spacer"));
    buttons.forEach(function (b) { head.appendChild(b); });
    card.appendChild(head);
  }

  function smallButton(id, text, onClick) {
    var b = el("button", "btn small", text);
    b.type = "button";
    b.id = id;
    b.addEventListener("click", onClick);
    return b;
  }

  function drawSection(n) {
    var id = idFor(n.path);
    var card = el("div", "card");
    var buttons = [];
    buttons.push(n.present
      ? smallButton("remove-" + id, "Remove", function () { toggleSection(n); })
      : smallButton("add-" + id, "Set up", function () { toggleSection(n); }));
    sectionHead(card, n, M.labelOf(n.key), buttons);
    if (n.key.help) {
      var intro = el("div", "intro");
      markdown(intro, n.key.help);
      card.appendChild(intro);
    }
    if (n.inactive) {
      card.appendChild(el("div", "inactive-note", "This does not apply to the current audio device. It is kept as it is."));
    }
    var err = el("div", "err");
    err.id = "e-" + id;
    err.hidden = true;
    err.style.padding = "6px 16px 0";
    card.appendChild(err);
    if (!n.present) {
      var absent = el("div", "absent", "Not set up");
      var d = n.key.docDefault;
      var m = d && /^absent(?:: |; )(.*)$/.exec(d);
      if (m) { absent.appendChild(document.createTextNode(": ")); markdown(absent, m[1]); }
      absent.appendChild(document.createTextNode("."));
      card.appendChild(absent);
      return card;
    }
    var body = el("div", "body");
    fillBody(body, n.children, n.path);
    card.appendChild(body);
    return card;
  }

  function atPath(path) {
    var at = M.parentOf(doc, path, true);
    return { at: at, current: typeof at.last === "number" ? at.obj[at.last] : M.get(at.obj, at.last) };
  }

  function toggleSection(n) {
    var s = atPath(n.path);
    if (s.current !== undefined && s.current !== null) M.remove(s.at.obj, s.at.last);
    else M.set(s.at.obj, s.at.last, {});
    edited(true);
  }

  function drawList(n) {
    var wrap = el("div");
    var noun = M.itemOf(n.key);
    var id = idFor(n.path);
    if (n.items.length === 0) {
      wrap.appendChild(el("p", "muted", "No " + M.labelOf(n.key).toLowerCase() + " yet. "
        + (n.key.help || "")));
    }
    n.items.forEach(function (item, i) {
      var card = el("div", "card");
      var entry = M.valueAt(doc, item.path) || {};
      // Titled the way the station's own refusals name an entry: a modem by its sub-channel.
      var title = M.describePath(schema, item.path, [doc]);
      var mode = M.get(entry, "mode"), call = M.get(entry, "callsign");
      var bits = [];
      if (mode !== undefined) bits.push(mode);
      if (call !== undefined) bits.push(call);
      if (bits.length > 0) title += ": " + bits.join(", ");
      var del = smallButton("remove-" + idFor(item.path), "Remove", function () {
        var arr = M.valueAt(doc, n.path);
        arr.splice(i, 1);
        edited(true);
      });
      sectionHead(card, null, title, [del]);
      var err = el("div", "err");
      err.id = "e-" + idFor(item.path);
      err.hidden = true;
      err.style.padding = "6px 16px 0";
      card.appendChild(err);
      var body = el("div", "body");
      fillBody(body, item.children, item.path);
      card.appendChild(body);
      wrap.appendChild(card);
    });
    var add = el("button", "add", "Add a " + noun);
    add.type = "button";
    add.id = "add-" + id;
    add.addEventListener("click", function () {
      var s = atPath(n.path);
      var arr = s.current;
      if (!Array.isArray(arr)) { arr = []; M.set(s.at.obj, s.at.last, arr); }
      arr.push(M.newItem());
      edited(true);
    });
    wrap.appendChild(add);
    return wrap;
  }

  // ---------------------------------------------------------------- modems, and the band strip
  var SVGNS = "http://www.w3.org/2000/svg";
  var plan = { data: null, seq: 0, shown: 0, timer: null, overrides: {}, error: "", layout: null, geom: null, drag: null };
  var picker = { open: false, group: null };
  var autoChosen = {};   // sub-channels the page picked for a modem it added
  var PLAN_DELAY = 250;

  function svg(tag, attrs, text) {
    var e = document.createElementNS(SVGNS, tag);
    for (var a in attrs) if (Object.prototype.hasOwnProperty.call(attrs, a)) e.setAttribute(a, attrs[a]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function radioKind() {
    var s = M.get(doc, "sideband");
    return typeof s === "string" && s !== "" ? s.toLowerCase() : "usb";
  }

  function modemList() {
    var list = M.get(doc, "modems");
    return Array.isArray(list) ? list : [];
  }

  // Whether the modems are placed by radio frequency: a dial, so MHz, and not on an FM set.
  function placedByDial() {
    return radioKind() !== "fm" && modemList().some(function (m) { return M.isSet(M.get(m, "rfFrequency")); });
  }

  function modemKey(name) {
    var keys = schema.types.ModemConfig.keys;
    for (var i = 0; i < keys.length; i++) if (keys[i].name === name) return keys[i];
    return null;
  }

  function subOf(entry) {
    var v = M.get(entry, "subChannel");
    return v === undefined || v === null ? 0 : v;
  }

  function planFor(sub) {
    var list = plan.data ? plan.data.modems : [];
    for (var i = 0; i < list.length; i++) if (list[i].subChannel === sub) return list[i];
    return null;
  }

  function warningsFor(sub) {
    return plan.data ? plan.data.warnings.filter(function (w) { return w.subChannel === sub; }) : [];
  }

  // Asks the station where the modems would sit, a moment after the last change.
  function schedulePlan(now) {
    if (!schema || !doc || !(route() === "modes" || (route() === "setup" && setup.step === "modes"))) return;
    clearTimeout(plan.timer);
    var seq = ++plan.seq;
    var strip = $("strip");
    if (strip) strip.classList.add("stale");
    plan.timer = setTimeout(function () { runPlan(seq); }, now ? 0 : PLAN_DELAY);
  }

  function planNow() {
    if (modemList().length === 0) return Promise.resolve(null);
    var query = restoredFrom ? "?restoreFrom=" + encodeURIComponent(restoredFrom) : "";
    return api("api/config/plan" + query, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(doc)
    }).then(function (r) {
      if (r.status === 401) { load(); return null; }
      return r.text().then(function (t) {
        if (r.status !== 200) return { failed: M.problemText(t) };
        return JSON.parse(t);
      });
    });
  }

  function runPlan(seq) {
    if (modemList().length === 0) { plan.data = null; plan.error = ""; paintPlan(); return; }
    planNow().then(function (answer) {
      if (seq !== plan.seq || answer === null) return;
      if (answer.failed !== undefined) {
        plan.error = answer.failed;
      } else {
        plan.data = answer;
        plan.error = "";
      }
      plan.shown = seq;
      // A block still being dragged keeps the place the pointer gave it; the rest are the station's.
      var held = {};
      if (plan.drag && plan.overrides[plan.drag.sub] !== undefined) held[plan.drag.sub] = plan.overrides[plan.drag.sub];
      plan.overrides = held;
      paintPlan();
    }).catch(function () {
      if (seq === plan.seq) { plan.error = "Could not reach the station to place these modems."; paintPlan(); }
    });
  }

  // Everything that shows the plan: the strip, each modem's hint and its warning.
  function paintPlan() {
    // A block being dragged is never rebuilt under the pointer: the drawing is brought up to date
    // when it is let go.
    if (plan.drag) plan.dirty = true; else paintStrip();
    document.querySelectorAll("[data-hint-for]").forEach(function (h) {
      var sub = Number(h.dataset.hintFor);
      var m = planFor(sub);
      var entry = findModem(sub);
      var text = "";
      if (m && m.leaseOnly) {
        text = "Tuned by its lease" + (typeof m.leaseDialHz === "number" && m.audioCentreHz !== null
          ? ": dial " + M.mhzText(m.leaseDialHz) + " MHz, audio tone " + Math.round(m.audioCentreHz) + " Hz" : "");
      } else if (placedByDial()) {
        var rf = entry ? M.get(entry, "rfFrequency") : undefined;
        if (typeof rf === "number" && plan.data && typeof plan.data.dialHz === "number") {
          text = "Audio tone " + Math.round(M.toneHz(rf, plan.data.dialHz, plan.data.radio)) + " Hz at this dial";
        }
      } else if (m && m.audioCentreHz !== null) {
        text = entry && M.isSet(M.get(entry, "frequency")) ? "" : "The mode's own tone, " + Math.round(m.audioCentreHz) + " Hz";
      }
      h.textContent = text;
    });
    document.querySelectorAll("[data-warn-for]").forEach(function (w) {
      var list = warningsFor(Number(w.dataset.warnFor));
      w.textContent = list.map(function (x) { return x.text; }).join(" ");
      w.hidden = list.length === 0;
      var box = w.parentElement.querySelector(".input");
      if (box) box.classList.toggle("warned", list.length > 0);
    });
  }

  function findModem(sub) {
    var list = modemList();
    for (var i = 0; i < list.length; i++) if (subOf(list[i]) === sub) return list[i];
    return null;
  }

  function indexOfModem(sub) {
    var list = modemList();
    for (var i = 0; i < list.length; i++) if (subOf(list[i]) === sub) return i;
    return -1;
  }

  function modemTitle(entry) {
    var info = M.modeInfo(schema, M.get(entry, "mode"));
    return info ? info.name : (M.get(entry, "mode") || "Modem");
  }

  // ---- the strip
  function drawStrip() {
    var wrap = el("div", "strip");
    wrap.id = "strip";
    var caption = el("div", "caption");
    caption.appendChild(el("span"));
    caption.appendChild(el("span", null, "Width shown is each mode's occupied bandwidth"));
    caption.id = "strip-caption";
    wrap.appendChild(caption);
    var view = el("div", "view");
    view.id = "strip-view";
    wrap.appendChild(view);
    var keys = el("div", "key");
    keys.id = "strip-key";
    wrap.appendChild(keys);
    wrap.appendChild(el("div", "problem"));
    wrap.lastChild.id = "strip-problem";
    wrap.lastChild.hidden = true;
    return wrap;
  }

  function paintStrip() {
    var wrap = $("strip");
    if (!wrap) return;
    var view = $("strip-view"), caption = $("strip-caption"), keys = $("strip-key"), problem = $("strip-problem");
    wrap.classList.toggle("stale", plan.shown !== plan.seq);
    problem.hidden = plan.error === "";
    problem.textContent = plan.error;
    if (!plan.data) {
      caption.firstChild.textContent = plan.error === "" ? "Working out where the modems sit..." : "";
      view.textContent = "";
      keys.textContent = "";
      plan.layout = null;
      return;
    }
    var focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.sub : null;
    var words = M.stripCaption(plan.data);
    caption.firstChild.textContent = "";
    caption.firstChild.appendChild(el("b", null, words.head));
    caption.firstChild.appendChild(document.createTextNode(words.tail ? ", " + words.tail : ""));
    var W = Math.max(280, Math.floor(view.clientWidth || 600));
    var PAD = 14;
    var narrow = W < 500;
    // Tick labels are never closer than their own width and a gap: fewer, shorter ones on a phone.
    var usable = W - 2 * PAD;
    var layout = M.stripLayout(plan.data, plan.overrides, 1);
    var charsPer = plan.data.axis === "rf" ? 7 : 5;
    var maxTicks = Math.max(2, Math.floor(usable / (charsPer * 6.8 + 18)));
    layout = M.stripLayout(plan.data, plan.overrides, maxTicks);
    plan.layout = layout;
    function x(pos) { return PAD + (pos - layout.lo) / (layout.hi - layout.lo) * (W - 2 * PAD); }
    // Labels: one row above the blocks, and a second (third) row for a label that would touch one
    // already placed, so none overlap.
    var placed = [];
    layout.blocks.slice().sort(function (p, q) { return p.centre - q.centre; }).forEach(function (b) {
      var entry = findModem(b.subChannel);
      var name = entry ? modemTitle(entry) : b.mode;
      var max = narrow ? 18 : 28;
      b.text = name.length > max ? name.slice(0, max - 1) + "." : name;
      b.labelW = b.text.length * 6.8;
      var mid = x(b.centre);
      b.labelLeft = Math.max(2, Math.min(W - 2 - b.labelW, mid - b.labelW / 2));
      var row = 0;
      for (;;) {
        var clash = placed.some(function (o) { return o.row === row && b.labelLeft < o.labelLeft + o.labelW + 8 && b.labelLeft + b.labelW + 8 > o.labelLeft; });
        if (!clash) break;
        row++;
      }
      b.row = row;
      placed.push(b);
    });
    var rows = placed.reduce(function (m, b) { return Math.max(m, b.row + 1); }, 1);
    var TOP = 30 + rows * 15, BOTTOM = TOP + (narrow ? 42 : 52), H = BOTTOM + 44;
    plan.geom = { W: W, pad: PAD, x: x, top: TOP };
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "group", id: "strip-svg",
                         "aria-label": words.head + (words.tail ? ", " + words.tail : "") });
    if (layout.passband) {
      s.appendChild(svg("rect", { x: x(layout.passband.lo), y: 22, width: Math.max(1, x(layout.passband.hi) - x(layout.passband.lo)),
                                  height: BOTTOM - 22, fill: "#56c8dd", "fill-opacity": ".06", stroke: "#56c8dd", "stroke-opacity": ".35" }));
      s.appendChild(svg("text", { x: x(layout.passband.lo) + 4, y: 16, fill: "#8793a0", "font-size": 11 }, "what the radio hears"));
    }
    if (layout.dial !== null) {
      s.appendChild(svg("line", { x1: x(layout.dial), y1: 10, x2: x(layout.dial), y2: BOTTOM + 6, stroke: "#f5a83c", "stroke-width": 1.5 }));
      s.appendChild(svg("text", { x: x(layout.dial) + 4, y: BOTTOM + 16, fill: "#f5a83c", "font-size": 11 }, "dial"));
    }
    s.appendChild(svg("line", { x1: 0, y1: BOTTOM + 4, x2: W, y2: BOTTOM + 4, stroke: "#1e2632" }));
    layout.ticks.forEach(function (t) {
      var tx = x(t.pos);
      var anchor = tx < 24 ? "start" : tx > W - 24 ? "end" : "middle";
      s.appendChild(svg("line", { x1: tx, y1: BOTTOM + 4, x2: tx, y2: BOTTOM + 10, stroke: "#2a3441" }));
      s.appendChild(svg("text", { x: tx, y: H - 6, fill: "#8793a0", "font-size": 11, "text-anchor": anchor,
                                  "font-family": "ui-monospace, monospace" }, t.label));
    });
    // The edge a block sticks out past, drawn under the blocks so no label or number is struck through.
    layout.blocks.forEach(function (b) {
      if (!layout.passband || b.kinds.indexOf("outside") < 0) return;
      var edge = b.hi > layout.passband.hi + 0.5 ? layout.passband.hi : layout.passband.lo;
      s.appendChild(svg("line", { x1: x(edge), y1: 22, x2: x(edge), y2: BOTTOM, stroke: "#ffb86b", "stroke-width": 1.5 }));
    });
    layout.blocks.forEach(function (b) { s.appendChild(drawBlock(b, layout, x, TOP, BOTTOM)); });
    view.textContent = "";
    view.appendChild(s);
    keys.textContent = "";
    layout.blocks.forEach(function (b) {
      var item = el("span");
      var sw = el("i");
      sw.style.background = M.colourOf(indexOfModem(b.subChannel));
      item.appendChild(sw);
      var entry = findModem(b.subChannel);
      var text = entry ? modemTitle(entry) : b.mode;
      if (b.kinds.indexOf("outside") >= 0) text += ", sticks out past the edge";
      else if (b.kinds.indexOf("overlap") >= 0) text += ", overlaps another";
      item.appendChild(document.createTextNode(text));
      keys.appendChild(item);
    });
    if (focused !== null && focused !== undefined) {
      var back = s.querySelector('[data-sub="' + focused + '"]');
      if (back) back.focus();
    }
  }

  function blockGeometry(b, layout, x) {
    var left = x(b.lo), right = x(b.hi);
    return { left: left, width: Math.max(6, right - left) };
  }

  function drawBlock(b, layout, x, top, bottom) {
    var colour = M.colourOf(indexOfModem(b.subChannel));
    var g = svg("g", { "class": "blk" + (b.movable ? "" : " fixed"), "data-sub": b.subChannel, "data-centre": b.centre });
    var entry = findModem(b.subChannel);
    var name = entry ? modemTitle(entry) : b.mode;
    var rf = layout.axis === "rf";
    g.setAttribute("aria-label", name + ", sub-channel " + b.subChannel);
    if (b.movable) {
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "slider");
      g.setAttribute("aria-orientation", "horizontal");
      var lim = M.layoutLimits(layout, b.width, plan.data ? plan.data.nyquistHz : undefined);
      g.setAttribute("aria-valuemin", String(Math.ceil(lim.min / 100) * 100));
      g.setAttribute("aria-valuemax", String(Math.floor(lim.max / 100) * 100));
      g.setAttribute("aria-valuenow", String(Math.round(b.centre)));
      g.setAttribute("aria-valuetext", rf ? M.mhzText(b.centre) + " MHz" : Math.round(b.centre) + " Hz");
    }
    var geo = blockGeometry(b, layout, x);
    var flagged = b.kinds.length > 0;
    // A solid underlay, so whatever is drawn behind a block (the edge of the passband) does not show through it.
    g.appendChild(svg("rect", { "class": "under", x: geo.left, y: top, width: geo.width, height: bottom - top, rx: 3, fill: "#11161d" }));
    var rect = svg("rect", { "class": "body", x: geo.left, y: top, width: geo.width, height: bottom - top, rx: 3,
                             fill: colour, "fill-opacity": flagged ? ".6" : ".85" });
    if (flagged) { rect.setAttribute("stroke", "#ffb86b"); rect.setAttribute("stroke-width", "1.5"); rect.setAttribute("stroke-dasharray", "4 3"); }
    g.appendChild(rect);
    g.appendChild(svg("text", { "class": "lbl", x: b.labelLeft, y: top - 8 - b.row * 15, fill: "#d9e2ea", "font-size": 12,
                                stroke: "#11161d", "stroke-width": 6, "paint-order": "stroke", "stroke-linejoin": "round" }, b.text));
    g.appendChild(svg("text", { "class": "num", x: geo.left + geo.width / 2, y: (top + bottom) / 2 + 4, fill: "#10151b", "font-size": 13,
                                "font-weight": 600, "text-anchor": "middle" }, String(b.subChannel)));
    if (b.movable) wireBlock(g, b);
    return g;
  }

  // Moves a drawn block to a new centre without redrawing the strip, so a pointer that has hold
  // of it keeps hold.
  function placeBlock(g, b, centre) {
    var layout = plan.layout, x = plan.geom.x;
    var moved = { lo: centre - b.width / 2, hi: centre + b.width / 2 };
    var geo = blockGeometry(moved, layout, x);
    g.querySelectorAll("rect").forEach(function (r) { r.setAttribute("x", geo.left); r.setAttribute("width", geo.width); });
    var lbl = g.querySelector("text.lbl");
    lbl.setAttribute("x", Math.max(2, Math.min(plan.geom.W - 2 - b.labelW, geo.left + geo.width / 2 - b.labelW / 2)));
    g.querySelector("text.num").setAttribute("x", geo.left + geo.width / 2);
    g.dataset.centre = centre;
    var rf = layout.axis === "rf";
    g.setAttribute("aria-valuenow", String(Math.round(centre)));
    g.setAttribute("aria-valuetext", rf ? M.mhzText(centre) + " MHz" : Math.round(centre) + " Hz");
  }

  // Writes a modem's new place into the document and into its field, and lets the station
  // know a change was made. On the radio axis that is its radio frequency; on the audio axis its audio frequency.
  function setPosition(sub, pos) {
    var entry = findModem(sub);
    if (!entry) return;
    // Written where the card writes: by the same rule that decides which field the card shows.
    var rf = placedByDial();
    var name = rf ? "rfFrequency" : "frequency";
    M.set(entry, name, pos);
    if (rf) M.remove(entry, "frequency");
    var input = $("f-modems_" + indexOfModem(sub) + "__" + name);
    if (input) {
      input.value = rf ? M.mhzText(pos) : String(pos);
      delete errors["modems[" + indexOfModem(sub) + "]." + name];
      var box = input.parentElement;
      box.classList.remove("invalid");
      var label = input.closest(".field").querySelector("label");
      var at = "modems[" + indexOfModem(sub) + "]." + name;
      label.classList.toggle("changed", JSON.stringify(M.valueAt(loaded, at)) !== JSON.stringify(pos));
    }
    var hint = document.querySelector('[data-hint-for="' + sub + '"]');
    var lease = planFor(sub);
    if (hint && rf && !(lease && lease.leaseOnly) && plan.data && typeof plan.data.dialHz === "number") {
      hint.textContent = "Audio tone " + Math.round(M.toneHz(pos, plan.data.dialHz, plan.data.radio)) + " Hz at this dial";
    }
    edited(false);
  }

  // Whether the strip on screen is drawn in the units the cards write, so a move of a block
  // means what its field means.
  function stripAgrees() {
    return !!plan.layout && (plan.layout.axis === "rf") === placedByDial();
  }

  function limitsOf(b) {
    return M.layoutLimits(plan.layout, b.width, plan.data ? plan.data.nyquistHz : undefined);
  }

  function endDrag(g) {
    if (!plan.drag) return;
    plan.drag = null;
    g.classList.remove("dragging");
    if (plan.dirty) { plan.dirty = false; paintStrip(); }
    schedulePlan(true);
  }

  function wireBlock(g, b) {
    var sub = b.subChannel;
    function move(pos) {
      var lim = limitsOf(b);
      pos = Math.max(Math.ceil(lim.min / 100) * 100, Math.min(Math.floor(lim.max / 100) * 100, pos));
      if (pos === Number(g.dataset.centre)) return;
      plan.overrides[sub] = pos;
      placeBlock(g, b, pos);
      setPosition(sub, pos);
    }
    g.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button > 0) return;
      if (!stripAgrees()) return;
      var s = $("strip-svg");
      var width = s.getBoundingClientRect().width || plan.geom.W;
      // One pixel of the page is the axis span over the usable width of the drawing, in pixels.
      var usable = (plan.geom.W - 2 * plan.geom.pad) * (width / plan.geom.W);
      plan.drag = { sub: sub, pointer: e.pointerId, startX: e.clientX, start: Number(g.dataset.centre),
                    hzPerPx: (plan.layout.hi - plan.layout.lo) / usable, moved: false };
      try { g.setPointerCapture(e.pointerId); } catch (err) { /* a synthetic pointer has nothing to capture */ }
      g.classList.add("dragging");
      g.focus();
      e.preventDefault();
    });
    g.addEventListener("pointermove", function (e) {
      var d = plan.drag;
      if (!d || d.pointer !== e.pointerId) return;
      // A button let go somewhere the block never heard of ends the drag rather than leaving it stuck.
      if (e.pointerType === "mouse" && e.buttons === 0) { endDrag(g); return; }
      // A click, or a finger's jitter, is not a drag.
      if (!d.moved) { if (!M.dragMoved(e.clientX - d.startX)) return; d.moved = true; }
      var lim = limitsOf(b);
      move(M.dragTo(d.start, e.clientX - d.startX, d.hzPerPx, 100, lim.min, lim.max));
    });
    function end(e) { if (plan.drag && plan.drag.pointer === e.pointerId) endDrag(g); }
    g.addEventListener("pointerup", end);
    g.addEventListener("pointercancel", end);
    g.addEventListener("lostpointercapture", end);
    g.addEventListener("keydown", function (e) {
      if (!stripAgrees()) return;
      var lim = limitsOf(b);
      var pos = M.keyMove(e.key, e.shiftKey, Number(g.dataset.centre), lim.min, lim.max);
      if (pos === null) return;
      e.preventDefault();
      move(pos);
    });
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if ($("strip") && !plan.drag) paintStrip(); }, 120);
  });

  // ---- the cards
  function drawModems(n) {
    var wrap = el("div");
    wrap.id = "modems";
    var list = modemList();
    if (list.length > 0) wrap.appendChild(drawStrip());
    else wrap.appendChild(el("p", "muted", "No modems yet. Add one to start listening."));
    var byDial = placedByDial();
    n.items.forEach(function (item, i) { wrap.appendChild(drawModem(n, item, i, byDial)); });
    var add = el("button", "add", "Add a modem");
    add.type = "button";
    add.id = "add-" + idFor(n.path);
    add.addEventListener("click", function () {
      picker = { open: !picker.open, group: null };
      render();
      if (picker.open && $("picker")) $("picker").scrollIntoView({ block: "nearest" });
    });
    wrap.appendChild(add);
    if (picker.open) wrap.appendChild(drawPicker(n));
    return wrap;
  }

  function drawModem(n, item, i, byDial) {
    var entry = M.valueAt(doc, item.path) || {};
    var sub = subOf(entry);
    var info = M.modeInfo(schema, M.get(entry, "mode"));
    var tunable = info ? info.tunable : true;
    var card = el("div", "card modem");
    card.id = "modem-" + idFor(item.path);
    card.dataset.sub = sub;
    var head = el("div", "head");
    var who = el("div", "who");
    var line = el("div", "line");
    var sw = el("span", "swatch");
    sw.style.background = M.colourOf(i);
    line.appendChild(sw);
    line.appendChild(el("span", "name", modemTitle(entry)));
    line.appendChild(el("span", "sub", "Sub-channel " + sub));
    who.appendChild(line);
    if (info) who.appendChild(el("div", "talks", "Talks to " + info.talksTo));
    head.appendChild(who);
    head.appendChild(smallButton("remove-" + idFor(item.path), "Remove", function () {
      var arr = M.valueAt(doc, n.path);
      arr.splice(i, 1);
      edited(true);
    }));
    card.appendChild(head);
    var err = el("div", "err");
    err.id = "e-" + idFor(item.path);
    err.hidden = true;
    err.style.padding = "6px 16px 0";
    card.appendChild(err);

    var body = el("div", "body");
    var node = function (name) {
      for (var k = 0; k < item.children.length; k++) {
        if (item.children[k].key && item.children[k].key.name === name) return item.children[k];
      }
      return null;
    };
    if (tunable) body.appendChild(drawFrequency(item, sub, byDial, info));
    var subNode = node("subChannel");
    if (subNode && subNode.shown) body.appendChild(drawSubChannel(subNode, sub));

    // Everything else a modem has: the mode, then the specialist keys, behind More.
    var more = [];
    var modeNode = node("mode");
    if (modeNode) more.push(modeNode);
    item.children.forEach(function (c) {
      if (!c.key || !c.shown || c === modeNode || c === subNode) return;
      if (c.key.name === "frequency") {
        // The card's own field has it, unless the mode takes no audio frequency or the station
        // has a dial (the daemon refuses the two together): then only a file that sets it shows it.
        if (tunable && !byDial) return;
        if (c.set) more.push(c);
        return;
      }
      if (c.key.name === "rfFrequency") {
        if (!byDial) more.push(c);
        return;
      }
      more.push(c);
    });
    if (more.length > 0) {
      var d = el("details", "more");
      d.id = "more-" + idFor(item.path);
      d.dataset.path = "more:" + item.path;
      if (moreOpen["more:" + item.path]) d.open = true;
      d.appendChild(el("summary", null, "More for this modem"));
      var inner = el("div", "inner");
      more.forEach(function (c) { inner.appendChild(drawNode(c)); });
      d.appendChild(inner);
      body.appendChild(d);
    }
    card.appendChild(body);
    return card;
  }

  // The KISS sub-channel as a compact choice of 0 to 15, with one line on what it is for. The
  // reference's own help and the key path are with the other keys under More.
  function drawSubChannel(n, sub) {
    var id = idFor(n.path);
    var row = el("div", "field");
    var label = el("label", null, "KISS sub-channel");
    label.htmlFor = id;
    row.appendChild(label);
    var box = el("div", "input");
    var select = el("select");
    select.id = id;
    var seen = false;
    for (var v = 0; v < 16; v++) {
      var opt = el("option", null, v + (v === sub && autoChosen[sub] ? " (chosen for you)" : ""));
      opt.value = String(v);
      select.appendChild(opt);
      if (v === sub) seen = true;
    }
    if (!seen) { var odd = el("option", null, String(sub)); odd.value = String(sub); select.appendChild(odd); }
    select.value = String(sub);
    box.appendChild(select);
    row.appendChild(box);
    row.appendChild(el("div", "hint", "What your node software calls this port"));
    var err = el("div", "err");
    err.id = "e-" + id;
    err.hidden = true;
    row.appendChild(err);
    var key = modemKey("subChannel");
    if (JSON.stringify(M.valueAt(loaded, n.path)) !== JSON.stringify(M.valueAt(doc, n.path))) label.classList.add("changed");
    select.addEventListener("change", function () {
      M.writeField(doc, n.path, key, select.value);
      edited(true, id);
    });
    return row;
  }

  // The frequency of a modem: MHz when the station has a dial, audio Hz when it has not.
  function drawFrequency(item, sub, byDial, info) {
    var name = byDial ? "rfFrequency" : "frequency";
    var path = item.path + "." + name;
    var id = idFor(path);
    var key = modemKey(name);
    var row = el("div", "field");
    var label = el("label", null, byDial ? "Frequency" : "Audio frequency");
    label.htmlFor = id;
    row.appendChild(label);
    var box = el("div", "input mono");
    var input = el("input");
    input.id = id;
    input.type = "text";
    input.spellcheck = false;
    input.autocomplete = "off";
    input.inputMode = "decimal";
    var value = M.valueAt(doc, path);
    var original = byDial ? (typeof value === "number" ? M.mhzText(value) : "") : M.toText(key, value);
    input.value = original;
    if (!byDial && info && typeof info.defaultCentreHz === "number") input.placeholder = String(info.defaultCentreHz);
    box.appendChild(input);
    box.appendChild(el("span", "unit", byDial ? "MHz" : "Hz"));
    row.appendChild(box);
    var hint = el("div", "hint");
    hint.dataset.hintFor = sub;
    row.appendChild(hint);
    var warn = el("div", "warntext");
    warn.dataset.warnFor = sub;
    warn.hidden = true;
    row.appendChild(warn);
    var err = el("div", "err");
    err.id = "e-" + id;
    err.hidden = true;
    row.appendChild(err);

    var differs = function () {
      return JSON.stringify(M.valueAt(loaded, path)) !== JSON.stringify(M.valueAt(doc, path));
    };
    if (differs()) label.classList.add("changed");
    input.addEventListener("input", function () {
      var reason = null, message = null;
      if (input.value !== original || errors[path] !== undefined) {
        if (byDial) {
          var parsed = M.mhzFromText(input.value);
          if (parsed.error) { reason = parsed.error; message = parsed.hint; }
          else reason = M.writeField(doc, path, key, String(parsed.value));
        } else {
          reason = M.writeField(doc, path, key, input.value);
        }
      }
      if (reason) { errors[path] = reason; } else { delete errors[path]; }
      if (input.value === original && !reason) {
        var at = M.parentOf(doc, path, true);
        var was = M.valueAt(loaded, path);
        if (was === undefined) M.remove(at.obj, at.last); else M.set(at.obj, at.last, clone(was));
      }
      box.classList.toggle("invalid", !!reason);
      err.hidden = !reason;
      err.textContent = reason ? (message || "Should be " + reason + ".") : "";
      label.classList.toggle("changed", differs());
      if (!reason) {
        var shown = M.valueAt(doc, path);
        if (typeof shown === "number") plan.overrides[sub] = shown;
        paintPlan();
      }
      edited(false);
    });
    return row;
  }

  // ---- the picker
  function drawPicker(n) {
    var card = el("div", "card");
    card.id = "picker";
    var head = el("div", "head");
    head.appendChild(el("span", "name", picker.group ? "Which one?" : "Add a modem: what do you want to talk to?"));
    head.appendChild(el("span", "spacer"));
    head.appendChild(smallButton("picker-close", "Cancel", function () { picker = { open: false, group: null }; render(); }));
    card.appendChild(head);
    var body = el("div", "body");
    var choices = el("div", "choices");
    var groups = schema.modes.groups;
    // Modes with no audio tone (the 9600 baud and OFDM-FM families) cannot be placed at a radio
    // frequency on a sideband radio, so a station placed that way is not offered them.
    var tunableOnly = placedByDial();
    var hidden = false;
    groups.forEach(function (g) {
      if (M.modesOfGroup(schema, g.id, tunableOnly).length !== M.modesOfGroup(schema, g.id).length) hidden = true;
    });
    if (!picker.group) {
      groups.forEach(function (g) {
        if (M.modesOfGroup(schema, g.id, tunableOnly).length === 0) return;
        choices.appendChild(choice("group-" + g.id, g.title, g.blurb, function () {
          var modes = M.modesOfGroup(schema, g.id, tunableOnly);
          if (modes.length === 1) { addModem(n, modes[0].mode); return; }
          picker.group = g.id;
          render();
        }));
      });
    } else {
      var nino = picker.group === "nino";
      M.modesOfGroup(schema, picker.group, tunableOnly).forEach(function (m) {
        var title = nino ? "NinoTNC mode " + m.ninoMode : m.name;
        var text = nino ? m.name : "Talks to " + m.talksTo;
        choices.appendChild(choice("mode-" + m.mode, title, text, function () { addModem(n, m.mode); }));
      });
      choices.appendChild(choice("back", "Back", "Choose something else to talk to", function () { picker.group = null; render(); }));
    }
    body.appendChild(choices);
    if (hidden) {
      var why = el("p", "muted", "Modes with no audio tone to place, such as 9600 baud packet and the OFDM modes, are not listed: "
        + "this station places its modems by radio frequency. Put them on a station that places them by audio frequency or on FM.");
      why.id = "picker-note";
      why.style.gridColumn = "1 / -1";
      why.style.fontSize = "13px";
      body.appendChild(why);
    }
    card.appendChild(body);
    return card;
  }

  function choice(id, title, text, onClick) {
    var b = el("button", "choice");
    b.type = "button";
    b.id = "choice-" + id;
    b.appendChild(el("b", null, title));
    b.appendChild(el("span", null, text));
    b.addEventListener("click", onClick);
    return b;
  }

  // Adds a modem of a mode on the next free sub-channel, in a free part of the passband.
  function addModem(n, mode) {
    var list = modemList();
    var sub = M.nextSubChannel(list);
    if (sub !== null) autoChosen[sub] = true;
    if (sub === null) {
      picker = { open: false, group: null };
      render();
      result("bad", "All 16 sub-channels have a modem. Remove one to add another.");
      return;
    }
    var info = M.modeInfo(schema, mode);
    var byDial = placedByDial();
    // The station is asked where things are now, so the free part found is free in its own plan.
    // On FM the modems share a channel; a file that gives one modem its channel (rfFrequency) must
    // give every modem one, so a new modem is put on the same channel.
    var channel = null;
    if (radioKind() === "fm") {
      list.forEach(function (m) {
        var v = M.get(m, "rfFrequency");
        if (channel === null && typeof v === "number") channel = v;
      });
    }
    planNow().then(function (data) {
      var place = [];
      if (list.length > 0 && (!info || info.tunable)) {
        var width = info ? info.widthHz : 500;
        var layout = data && data.ok ? M.stripLayout(data) : null;
        var taken = layout ? layout.blocks.map(function (b) { return { lo: b.lo, hi: b.hi }; }) : [];
        if (byDial) {
          var pb = layout ? layout.passband : null;
          if (pb) {
            var c = M.freeCentre(width, taken, pb.lo, pb.hi, 100);
            place.push({ key: "rfFrequency", value: c === null ? M.snap(pb.lo + width / 2, 100) : c });
          } else {
            // No plan to place in (it was refused): beside the highest modem the file has, in the
            // radio frequencies the cards use, so the new one has one like all the others.
            var top = null;
            list.forEach(function (m) {
              var v = M.get(m, "rfFrequency");
              if (typeof v !== "number") return;
              var mi = M.modeInfo(schema, M.get(m, "mode"));
              var edge = v + (mi ? mi.widthHz : 500) / 2;
              if (top === null || edge > top) top = edge;
            });
            if (top !== null) place.push({ key: "rfFrequency", value: M.snap(top + width / 2 + 100, 100) });
          }
        } else {
          var audio = data && data.passband && typeof data.passband.audioLowHz === "number"
            ? { lo: data.passband.audioLowHz, hi: data.passband.audioHighHz } : { lo: 300, hi: 3000 };
          var a = M.freeCentre(width, taken, audio.lo, audio.hi, 100);
          place.push({ key: "frequency", value: a === null ? M.snap(audio.lo + width / 2, 100) : a });
        }
      }
      if (channel !== null) place.push({ key: "rfFrequency", value: channel });
      var arr = M.valueAt(doc, n.path);
      if (!Array.isArray(arr)) { var s = atPath(n.path); arr = []; M.set(s.at.obj, s.at.last, arr); }
      arr.push(M.newModem(mode, sub, place));
      picker = { open: false, group: null };
      edited(true);
      var field = $("f-modems_" + (arr.length - 1) + "__" + (place.length > 0 ? place[0].key : "subChannel"));
      if (field) field.focus();
    });
  }

  var listId = 0;

  function drawField(n) {
    var k = n.key;
    var id = idFor(n.path);
    var wide = k.kind === "json" || k.kind === "array";
    var row = el("div", "field" + (wide ? " wide" : ""));
    var label = el("label", null, M.labelOf(k));
    label.htmlFor = id;
    row.appendChild(label);
    var box = el("div", "input");
    var input;

    var choiceLabels = k.choiceLabels || null;
    if (choiceLabels) {
      input = el("select");
      var chosen = k.default !== undefined && k.default !== null ? String(k.default) : "";
      var first = el("option", null, "Default" + (chosen && choiceLabels[chosen] ? " (" + choiceLabels[chosen] + ")" : ""));
      first.value = "";
      input.appendChild(first);
      Object.keys(choiceLabels).forEach(function (value) {
        var opt = el("option", null, choiceLabels[value]);
        opt.value = value;
        input.appendChild(opt);
      });
      if (n.text !== "" && !choiceLabels.hasOwnProperty(n.text)) {
        // A value the file has that this page does not know the name of is kept, as it is.
        var odd = el("option", null, n.text);
        odd.value = n.text;
        input.appendChild(odd);
      }
      input.value = n.text;
    } else if (k.kind === "boolean") {
      input = el("select");
      var dflt = k.default === true ? "yes" : k.default === false ? "no" : "";
      [["", "Default" + (dflt ? " (" + dflt + ")" : "")], ["true", "Yes"], ["false", "No"]].forEach(function (o) {
        var opt = el("option", null, o[1]);
        opt.value = o[0];
        input.appendChild(opt);
      });
      input.value = n.text;
    } else if (k.kind === "json" || k.kind === "array") {
      input = el("textarea");
      input.value = n.text;
      input.spellcheck = false;
      input.placeholder = k.kind === "array" ? "one per line" : "JSON";
    } else {
      input = el("input");
      input.type = k.secret ? "password" : "text";
      input.value = n.text;
      input.spellcheck = false;
      input.autocomplete = "off";
      if (k.secret) {
        input.autocomplete = "new-password";
        input.placeholder = n.secretSet ? "set, not shown: type a new one to replace it" : "not set";
      } else if (k.default !== undefined && k.default !== null && k.default !== "") {
        input.placeholder = String(k.default);
      }
      if (k.kind === "integer" || k.kind === "number") input.inputMode = k.kind === "integer" ? "numeric" : "decimal";
      if (k.choices) {
        var list = el("datalist");
        list.id = "choices-" + (listId++);
        k.choices.forEach(function (c) { var o = el("option"); o.value = c; list.appendChild(o); });
        box.appendChild(list);
        input.setAttribute("list", list.id);
      }
    }
    input.id = id;
    box.appendChild(input);
    if (k.unit) box.appendChild(el("span", "unit", k.unit));

    if (k.secret && n.secretSet) {
      var clear = el("button", "clear", "Clear");
      clear.type = "button";
      clear.title = "Remove this key from the file";
      clear.addEventListener("click", function () {
        var at = M.parentOf(doc, n.path, false);
        if (at) M.remove(at.obj, at.last);
        edited(true);
      });
      box.appendChild(clear);
    }
    row.appendChild(box);
    var kn = el("div", "keyname");
    kn.appendChild(el("code", null, M.docPath(n.path)));
    row.appendChild(kn);
    row.appendChild(help(k));
    var err = el("div", "err");
    err.id = "e-" + id;
    err.hidden = true;
    row.appendChild(err);

    var original = n.text;
    var differs = function () {
      return JSON.stringify(M.valueAt(loaded, n.path)) !== JSON.stringify(M.valueAt(doc, n.path));
    };
    if (differs()) label.classList.add("changed");
    var onEdit = function () {
      // Text the field already showed is left alone: a value the operator did not touch keeps
      // exactly the form the file had (a 7.0e6, an explicit null, an empty list).
      var reason = input.value === original ? null : M.writeField(doc, n.path, k, input.value);
      if (reason) { errors[n.path] = reason; } else { delete errors[n.path]; }
      if (input.value === original && errors[n.path] === undefined) {
        // Back to where it started: put the original value back too.
        var at = M.parentOf(doc, n.path, true);
        var was = M.valueAt(loaded, n.path);
        if (was === undefined) M.remove(at.obj, at.last); else M.set(at.obj, at.last, clone(was));
      }
      box.classList.toggle("invalid", !!reason);
      err.hidden = !reason;
      err.textContent = reason ? "Should be " + reason + "." : "";
      label.classList.toggle("changed", differs());
      edited(false);
    };
    input.addEventListener(input.tagName === "SELECT" ? "change" : "input", onEdit);
    // A change to what applies (the audio device, the keying method) changes what is drawn; that
    // waits for the field to be left, so typing is never interrupted.
    input.addEventListener("change", function () {
      if (shape() !== drawnShape) edited(true, id);
    });
    return row;
  }

  // ---------------------------------------------------------------- edits and checks
  var drawnShape = "";

  // Which keys the page would draw for the document now, so an edit that adds or removes one is
  // noticed.
  function shape() {
    var out = [];
    (function walk(nodes) {
      nodes.forEach(function (n) {
        if (n.node === "unknown") return;
        out.push(n.path + (n.shown ? "+" : "-") + (n.present ? "p" : ""));
        if (n.node === "section" && n.present) walk(n.children);
        if (n.node === "list") n.items.forEach(function (i) { walk(i.children); });
      });
    })(M.plan(schema, schema.root, doc, ""));
    return out.join(",");
  }

  // Something in the document changed. Draws the page again when the change adds or removes
  // something to draw (redraw), keeping the focus where it was.
  function edited(redraw, focusId) {
    result("", "");
    if (redraw) {
      var keep = focusId || (document.activeElement && document.activeElement.id);
      render();
      if (keep && $(keep)) $(keep).focus();
    }
    scheduleCheck();
    schedulePlan(false);
  }

  // A secret that differs in a restored version is a change too, though both documents show it
  // blanked and so the comparison cannot see it.
  function changedCount() { return M.diff(loaded, doc).length + (restoredFrom ? restoredSecrets.length : 0); }

  // Asks the station whether it would start on the document, about 700 ms after the last change.
  function scheduleCheck() {
    clearTimeout(checkTimer);
    var seq = check.seq + 1;
    if (changedCount() === 0 || Object.keys(errors).length > 0 || textInvalid) {
      check = { state: "idle", seq: seq, problem: "", path: null };
      paintIssue();
      renderPending();
      renderNav();
      return;
    }
    check = { state: "waiting", seq: seq, problem: "", path: null };
    paintIssue();
    renderPending();
    renderNav();
    checkTimer = setTimeout(function () { runCheck(seq); }, 700);
  }

  function runCheck(seq) {
    check.state = "checking";
    renderPending();
    post("?check=true").then(function (r) {
      if (seq !== check.seq) return;
      if (r.status === 200) {
        check = { state: "ok", seq: seq, problem: "", path: null };
      } else if (r.status === 401) {
        load();
        return;
      } else {
        var found = M.locateIssue(schema, doc, r.text);
        check = { state: "bad", seq: seq, problem: found.problem, path: found.path };
      }
      paintIssue();
      renderPending();
      renderNav();
    }).catch(function (e) {
      if (seq !== check.seq) return;
      check = { state: "bad", seq: seq, problem: "Could not reach the station to check this: " + e.message, path: null };
      paintIssue();
      renderPending();
    });
  }

  // Shows the station's refusal under the field it is about; one that names no field this page
  // draws is shown at the top of the page instead.
  function paintIssue() {
    document.querySelectorAll(".issue-here").forEach(function (e) {
      e.classList.remove("issue-here");
      e.hidden = true;
      e.textContent = "";
      var box = e.parentElement.classList.contains("field") && e.parentElement.querySelector(".input");
      if (box) box.classList.remove("invalid");
    });
    var banner = $("issue-banner");
    if (route() === "setup") paintSetupCheck();
    if (!banner) return;
    banner.hidden = true;
    if (route() === "setup") return;
    if (check.state !== "bad") return;
    var target = check.path ? $("e-" + idFor(check.path)) : null;
    if (target && target.hidden) {
      target.textContent = check.problem;
      target.hidden = false;
      target.classList.add("issue-here");
      var box = target.parentElement.classList.contains("field") && target.parentElement.querySelector(".input");
      if (box) box.classList.add("invalid");
      for (var p = target.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
      return;
    }
    banner.textContent = "";
    banner.appendChild(el("b", null, "The station would not start on this. "));
    banner.appendChild(document.createTextNode(check.problem));
    banner.hidden = false;
  }

  function result(kind, text) {
    $("result").className = kind;
    $("result").textContent = text;
    renderPending();
  }

  function renderPending() {
    if (!doc || !loaded) return;
    var count = changedCount();
    var labels = M.changedLabels(schema, loaded, doc);
    if (restoredFrom) {
      M.secretWords(restoredSecrets).forEach(function (w) { labels.push(w + " (the one this version had)"); });
    }
    var bad = Object.keys(errors).map(function (p) { return M.describePath(schema, p, [doc]); });
    if (textInvalid) bad.push("the text");
    var res = $("result").textContent;
    var text = "", note = "", cls = "";
    var canApply = false;
    if (busy) {
      text = "";
    } else if (bad.length > 0) {
      text = bad.length + (bad.length === 1 ? " field needs" : " fields need") + " fixing: " + bad.join(", ");
      cls = "bad";
    } else if (count > 0) {
      var list = labels.length > 6 ? labels.slice(0, 5).join(", ") + " and " + (labels.length - 5) + " more" : labels.join(", ");
      var head = labels.length + (labels.length === 1 ? " change" : " changes") + " not applied yet: " + list + ".";
      if (check.state === "bad") {
        text = "1 problem to fix before applying: " + check.problem;
        cls = "bad";
        note = head;
      } else {
        text = head;
        if (check.state === "ok") {
          canApply = true;
          note = "Looks good: the station would start on this. Applying restarts it for a few seconds.";
        } else {
          note = "Checking...";
        }
      }
    }
    $("changes").textContent = text;
    $("changes").className = cls;
    $("changes-note").textContent = note;
    $("changes-note").hidden = note === "";
    var notice = count > 0 && bad.length === 0 && !busy ? pageNotice() : null;
    var box = $("page-notice");
    box.textContent = "";
    box.hidden = !notice;
    if (notice) box.appendChild(notice);
    var extra = count > 0 && bad.length === 0 && !busy ? extraNotices() : [];
    extra.forEach(function (n) {
      if (!box.hidden) box.appendChild(document.createElement("br"));
      box.appendChild(n);
      box.hidden = false;
    });
    $("pending").hidden = !(count > 0 || res !== "" || busy);
    $("revert").disabled = busy || count === 0;
    $("try").disabled = !canApply || busy;
    $("save").disabled = !canApply || busy;
  }

  // Other things to say before applying: a restored version whose secrets differ, and a document
  // that makes the station a monitor.
  function extraNotices() {
    var out = [];
    if (restoredFrom && restoredSecrets.length > 0) {
      out.push(document.createTextNode(secretSentence(restoredSecrets)));
    }
    if (pickRemoved.length > 0) {
      out.push(document.createTextNode("Choosing that radio removed: " + pickRemoved.join(", ") + "."));
    }
    if (M.becomesMonitor(loaded, doc)) {
      out.push(document.createTextNode("This makes the station a monitor site. A monitor does not serve this "
        + "configuration page, so after the restart it will not answer here; to get it back, remove the "
        + "\"monitor\" section from the config file on the machine and restart."));
    }
    return out;
  }

  function secretSentence(paths) {
    var words = M.secretWords(paths);
    var text = words.length === 1 ? "The " + words[0] + " will change to the one this version had."
      : "The " + words.join(", ") + " will change to the ones this version had.";
    if (paths.indexOf("api.key") >= 0) text += " The access key changes too, so this browser will need that version's key afterwards.";
    return text;
  }

  // What applying does to the page the person is looking at, if it is not just a restart: it goes
  // away, or it moves (a restart cannot be waited for at an address that is about to change).
  function pageNotice() {
    var move = M.pageMove(loaded, doc, location.hostname, location.protocol);
    if (!move) return null;
    var out = document.createElement("span");
    if (move.kind === "removed") {
      out.textContent = "This removes the station page: after the restart this page and the station page will not answer. "
        + "To get them back, add a \"waterfall\" section to the config file on the station, such as "
        + "{\"waterfall\": {\"port\": 8107}}, and restart it.";
      return out;
    }
    out.appendChild(document.createTextNode("This moves the station page: after the restart it answers "));
    if (move.url) {
      out.appendChild(document.createTextNode("at "));
      var a = el("a", null, move.url);
      a.href = move.url;
      out.appendChild(a);
      out.appendChild(document.createTextNode(", not here."));
    } else {
      out.appendChild(document.createTextNode("only on the station itself, at " + move.local + ", not here."));
    }
    return out;
  }

  // ---------------------------------------------------------------- applying
  function post(query) {
    if (restoredFrom) query += (query === "" ? "?" : "&") + "restoreFrom=" + encodeURIComponent(restoredFrom);
    return api("api/config" + query, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(doc, null, 2)
    }).then(function (r) {
      return r.text().then(function (t) { return { status: r.status, text: t }; });
    });
  }

  $("revert").addEventListener("click", function () {
    doc = clone(loaded);
    restoredFrom = null;
    restoredSecrets = [];
    pickRemoved = [];
    textInvalid = false;
    result("", "");
    drawnShape = shape();
    scheduleCheck();
    render();
  });

  function apply(persist) {
    var notice = pageNotice();
    busy = true;
    result("", persist ? "Saving..." : "Applying...");
    post(persist ? "?persist=true" : "").then(function (r) {
      if (r.status !== 200) {
        busy = false;
        result("bad", M.problemText(r.text));
        return;
      }
      result("good", (persist ? "Saved to the file. " : "In force until the next restart. ")
        + "The station is restarting...");
      if (notice) {
        // The page it would wait on is about to be somewhere else, or nowhere: say so instead.
        $("result").appendChild(document.createTextNode(" "));
        $("result").appendChild(notice);
        return;
      }
      waitForRestart(Date.now(), persist);
    }).catch(function (e) {
      busy = false;
      result("bad", "Could not reach the station: " + e.message);
    });
  }

  // The station answers before it restarts, and goes on answering while it shuts down, so the
  // page waits for a different process to answer. A 401 is a station that is back with a key
  // this browser does not hold (one just set, or changed): back, and the login says the rest.
  function waitForRestart(started, persist) {
    var was = instance;
    setTimeout(function () {
      api("api/config").then(function (r) {
        if (r.status === 401) return { back: true };
        if (!r.ok) throw new Error();
        return r.json().then(function (a) { return { back: !was || a.instance !== was }; });
      }).then(function (state) {
        if (!state.back) { tryAgain(); return; }
        busy = false;
        return load().then(function () {
          if (setup.active && setup.phase === "restarting") { setup.phase = "done"; render(); }
          result("good", "The station is back, running on the new configuration"
            + (persist ? "." : " until its next restart."));
        });
      }).catch(tryAgain);
    }, 1500);

    function tryAgain() {
      if (Date.now() - started > 120000) {
        busy = false;
        if (setup.active && setup.phase === "restarting") { setup.phase = "steps"; setup.error = "The station has not come back after two minutes. Its journal says why: journalctl -u pdn-soundmodem"; render(); }
        result("bad", "The station has not come back after two minutes. Its journal says why: journalctl -u pdn-soundmodem");
      } else {
        waitForRestart(started, persist);
      }
    }
  }

  $("try").addEventListener("click", function () { apply(false); });
  $("save").addEventListener("click", function () { apply(true); });

  window.addEventListener("beforeunload", function (e) {
    // Inside setup, only what the person has chosen since it opened is worth a warning: the
    // emptied placeholders of a new station are not a change they made.
    var changed = setup.active && setup.phase === "steps" && setup.start
      ? JSON.stringify(doc) !== JSON.stringify(setup.start) : changedCount() > 0;
    if (doc && loaded && changed && !busy) { e.preventDefault(); e.returnValue = ""; }
  });

  // ---------------------------------------------------------------- guided setup
  // /config#setup: six steps over the same pending document, check and apply as the rest of the
  // page. Nothing is written until "Save and start". What each step writes is decided in the
  // model (M.setup*); this draws it.
  var neverConfigured = false;   // what the station said at the last read
  var setup = null;
  var keyTest = { state: "idle", text: "" };

  function newSetup() {
    return { active: false, step: "radio", kind: null, keying: false, phase: "steps", error: "", moved: null, showAll: false };
  }
  setup = newSetup();

  // A station that has never been configured (its file is the shipped example or empty) starts
  // from nothing, because the example's choices are placeholders; anything else starts from what
  // it has, and nothing a running station has is ever cleared.
  function enterSetup() {
    setup = newSetup();
    setup.active = true;
    setup.before = clone(doc);
    keyTest = { state: "idle", text: "" };
    station.levelSeen = false;
    if (neverConfigured && M.diff(loaded, doc).length === 0) {
      M.setupClearChoices(doc);
    } else {
      setup.kind = M.setupKindOf(doc);
      setup.keying = true;
    }
    setup.start = clone(doc);
    pickRemoved = [];
    if (found.state === "idle") look(false);
    scheduleCheck();
  }

  // Leaving setup any way but saving puts the document back as it was when setup opened, so a
  // half-made choice is never a pending change.
  function leaveSetup() {
    doc = clone(setup.before);
    setup.active = false;
    pickRemoved = [];
    scheduleCheck();
  }

  var STEP_TITLE = { radio: "your radio", card: "sound card", keying: "keying", modes: "choose modes", software: "your software", "try": "try it" };

  function goStep(id) {
    setup.step = id;
    setup.error = "";
    render();
    window.scrollTo(0, 0);
  }

  function setupFlags() { return { keying: setup.keying }; }

  function drawSetup(root) {
    var wrap = el("div", "setup");
    wrap.id = "setup";
    root.appendChild(wrap);
    var steps = M.setupSteps(setup.kind);
    var at = 0;
    steps.forEach(function (s, i) { if (s.id === setup.step) at = i; });
    var bar = el("ol", "steps");
    bar.id = "setup-steps";
    bar.setAttribute("aria-label", "Setup steps");
    steps.forEach(function (s, i) {
      var li = el("li", s.skipped ? "skip" : i < at ? "done" : i === at ? "now" : "");
      li.id = "step-item-" + s.id;
      if (i === at) li.setAttribute("aria-current", "step");
      if (s.skipped) li.title = "Not needed for this kind of radio";
      if (i < at && !s.skipped && setup.phase === "steps") {
        var b = el("button", null, s.title);
        b.type = "button";
        b.id = "step-" + s.id;
        b.addEventListener("click", function () { goStep(s.id); });
        li.appendChild(b);
      } else {
        li.appendChild(document.createTextNode(s.title));
      }
      bar.appendChild(li);
    });
    wrap.appendChild(bar);

    if (setup.phase === "saving" || setup.phase === "restarting") { drawSetupWaiting(wrap); return; }
    if (setup.phase === "done") { drawSetupDone(wrap); return; }

    var draw = { radio: drawStepRadio, card: drawStepCard, keying: drawStepKeying, modes: drawStepModes,
      software: drawStepSoftware, "try": drawStepTry }[setup.step];
    draw(wrap);

    var nav = el("div", "stepnav");
    var prev = M.setupPrev(setup.kind, setup.step);
    var next = M.setupNext(setup.kind, setup.step);
    if (prev) {
      var back = el("button", "btn", "Back to " + STEP_TITLE[prev]);
      back.type = "button";
      back.id = "setup-back";
      back.addEventListener("click", function () { goStep(prev); });
      nav.appendChild(back);
    } else {
      nav.appendChild(el("span"));
    }
    if (next) {
      var go = el("button", "btn primary", "Next: " + STEP_TITLE[next]);
      go.type = "button";
      go.id = "setup-next";
      go.disabled = !M.setupComplete(doc, setup.kind, setup.step, setupFlags());
      go.addEventListener("click", function () { goStep(next); });
      nav.appendChild(go);
    }
    wrap.appendChild(nav);
    wrap.appendChild(el("p", "elsewhere", "Nothing is changed until the last step. You can come back to any step from the settings page later."));
  }

  function foundBox(wrap) {
    var box = el("div", "found");
    box.id = "found";
    wrap.appendChild(box);
    paintFound();
    if (found.state === "idle") look(false);
  }

  // ---- 1. Your radio
  function drawStepRadio(wrap) {
    wrap.appendChild(el("h1", null, "What kind of radio is this station?"));
    if (setup.kind === "other") {
      wrap.appendChild(el("p", "lede", "This station listens through " + String(M.get(doc, "device")) + "; change it in settings."));
      var go = el("a", "btn", "Open the radio settings");
      go.href = "#radio";
      go.id = "setup-other-settings";
      wrap.appendChild(go);
      return;
    }
    wrap.appendChild(el("p", "lede", "This decides which of the next steps are needed."));
    var kinds = [
      ["fm", "A sound card into an FM radio", "Most VHF and UHF packet and APRS: a radio on 144 or 430 MHz with a data or microphone lead to a USB sound card or a CM108 interface."],
      ["ssb", "A sound card into an SSB radio", "HF packet and data: a radio on upper sideband, with a USB sound card or the radio's own USB audio."],
      ["flex", "A FlexRadio on your network", "The audio comes from the radio over the network and the radio keys itself."],
      ["ubersdr", "A web receiver (UberSDR)", "Listen only. No radio of your own is needed and nothing is transmitted."]
    ];
    kinds.forEach(function (k) {
      wrap.appendChild(option("kind-" + k[0], setup.kind === k[0], k[1], k[2], function () {
        setup.kind = k[0];
        M.setupPickKind(doc, k[0]);
        if (k[0] === "ubersdr") setup.keying = true;
        edited(true, "pick-kind-" + k[0]);
      }, "", "setup-kind"));
    });
    if (setup.kind === "flex" || setup.kind === "ubersdr") {
      foundBox(wrap);
      if (setup.kind === "ubersdr") {
        var urow = el("div", "field");
        var ulab = el("label", null, "Or type a receiver, a host or an ubersdr: device");
        ulab.htmlFor = "setup-uber-device";
        urow.appendChild(ulab);
        var uwrap = el("div", "input");
        var uin = el("input");
        uin.id = "setup-uber-device";
        uin.placeholder = "ubersdr:m9psy-1.instance.ubersdr.org";
        var ucur = String(M.get(doc, "device") || "");
        uin.value = ucur.toLowerCase().indexOf("ubersdr:") === 0 ? ucur : "";
        uin.addEventListener("change", function () {
          var v = uin.value.trim();
          if (v === "") return;
          if (v.toLowerCase().indexOf("ubersdr:") !== 0) v = "ubersdr:" + v;
          M.pickRadio(doc, { device: v, section: { name: "ubersdr", value: { mode: "iq48" } }, ownKeying: true, kind: "ubersdr" });
          edited(true, "setup-uber-device");
        });
        uwrap.appendChild(uin);
        urow.appendChild(uwrap);
        wrap.appendChild(urow);
      }
      if (setup.kind === "flex") {
        var row = el("div", "field");
        var lab = el("label", null, "Or type the radio's address");
        lab.htmlFor = "setup-flex-ip";
        row.appendChild(lab);
        var wrapIn = el("div", "input");
        var inp = el("input");
        inp.id = "setup-flex-ip";
        inp.placeholder = "192.168.1.50";
        var cur = String(M.get(doc, "device") || "");
        inp.value = cur.toLowerCase().indexOf("flex:") === 0 ? cur.slice(5) : "";
        inp.addEventListener("change", function () {
          var v = inp.value.trim();
          if (v === "") return;
          M.pickRadio(doc, { device: "flex:" + v, section: { name: "flex", value: {} }, ownKeying: true, kind: "flex" });
          edited(true, "setup-flex-ip");
        });
        wrapIn.appendChild(inp);
        row.appendChild(wrapIn);
        wrap.appendChild(row);
      }
    }
  }

  // ---- 2. Sound card

  // ---- 3. Keying
  function drawStepKeying(wrap) {
    wrap.appendChild(el("h1", null, "How does this station key the radio?"));
    wrap.appendChild(el("p", "lede", "Packet needs the radio to transmit when the modem talks. These are the ways this machine could do that."));
    if (setup.kind === "flex") {
      wrap.appendChild(el("p", "stepnote", "A FlexRadio keys itself, so there is nothing to choose here."));
      setup.keying = true;
    } else {
      foundBox(wrap);
    }

    box.id = "keytest";

  }

  // The "Key the radio for 2 seconds" box. It keys the station as it is running, behind a confirm,
  // by the station page's own route: the txtest message over the page socket, which is open to
  // the same pages as the station page's own button and opens nothing new.
  function paintKeyTest() {
    var box = $("keytest");
    if (!box) return;
    box.textContent = "";
    var st = M.keyTestState(loaded, doc, station.tx);
    if (!st.ok) {
      var why = el("span", "warn", st.why);
      why.id = "keytest-why";
      box.appendChild(why);
      return;
    }
    if (keyTest.state === "confirm") {
      var ask = el("span", null, "This transmits a steady tone for 2 seconds. Check the radio is on a frequency you may use, with an antenna or a dummy load connected.");
      ask.id = "keytest-ask";
      box.appendChild(ask);
      var yes = el("button", "btn primary", "Yes, key it");
      yes.type = "button";
      yes.id = "keytest-yes";
      yes.addEventListener("click", runKeyTest);
      box.appendChild(yes);
      var no = el("button", "btn", "Cancel");
      no.type = "button";
      no.id = "keytest-cancel";
      no.addEventListener("click", function () { keyTest = { state: "idle", text: "" }; paintKeyTest(); });
      box.appendChild(no);
      return;
    }
    var go = el("button", "btn", "Key the radio for 2 seconds");
    go.type = "button";
    go.id = "keytest-go";
    go.disabled = keyTest.state === "running";
    go.addEventListener("click", function () { keyTest = { state: "confirm", text: "" }; paintKeyTest(); });
    box.appendChild(go);
    if (keyTest.text) {
      var r = el("span", keyTest.state === "bad" ? "bad" : "good", keyTest.text);
      r.id = "keytest-result";
      box.appendChild(r);
      if (keyTest.detail) {
        var d = el("small", "muted", keyTest.detail);
        d.id = "keytest-detail";
        box.appendChild(d);
      }
    }
  }

  function runKeyTest() {
    clearTimeout(keyTest.timer);
    if (!station.ws || station.ws.readyState !== 1) {
      keyTest = { state: "bad", text: "Not connected to the station yet. Try again in a moment." };
      paintKeyTest();
      return;
    }
    keyTest = { state: "running", text: "Keying the radio..." };
    keyTest.timer = setTimeout(function () {
      if (keyTest.state !== "running") return;
      keyTest = { state: "bad", text: "The station did not answer. Its journal says what it did: journalctl -u pdn-soundmodem" };
      paintKeyTest();
    }, 75000);   // longer than the runner's 60 s wait for a clear channel
    station.ws.send(JSON.stringify({ type: "txtest", twoTone: false, toneHz: 1000, seconds: 2 }));
    paintKeyTest();
  }

  // What the station says became of a test (the page socket's txtest message).
  function onKeyStatus(msg) {
    // Only a test this page started: another tab's, or none, is not this page's to report.
    if (keyTest.state !== "running") return;
    if (msg.state === "running") { keyTest = { state: "running", text: "Keying the radio...", timer: keyTest.timer }; }
    else if (msg.state === "done") {
      clearTimeout(keyTest.timer);
      keyTest = { state: "good", text: "Keyed and released. Did the radio's TX light come on?", detail: "The station says: " + msg.text };
    } else if (msg.state === "refused" || msg.state === "failed") {
      clearTimeout(keyTest.timer);
      keyTest = { state: "bad", text: "The station did not key the radio: " + (msg.text || "it gave no reason; its journal says why: journalctl -u pdn-soundmodem") };
    } else return;
    paintKeyTest();
  }

  // ---- the station page's socket, for the key test and the level meter
  // Opened only while setup needs it (the keying step and the screen after the restart). The
  // first message is the station's config, which says whether a test can run at all.
  var station = { ws: null, tx: null, levelSeen: false, stale: 0, retry: 0 };

  function stationNeeded() {
    return route() === "setup" && setup.active && (setup.phase === "done" || (setup.phase === "steps" && setup.step === "keying"));
  }

  function openStation() {
    if (station.ws) return;
    var scheme = location.protocol === "https:" ? "wss" : "ws";
    var base = location.pathname.replace(/[^\/]*$/, "");
    var ws;
    try { ws = new WebSocket(scheme + "://" + location.host + base + "ws"); } catch (e) { return; }
    station.ws = ws;
    ws.onmessage = function (e) {
      if (typeof e.data !== "string") return;
      var m;
      try { m = JSON.parse(e.data); } catch (x) { return; }
      if (!m) return;
      if (m.type === "config") {
        station.tx = !m.txTest ? { available: false, refusal: "this page has no transmit test here" }
          : { available: !m.txTest.refusal, refusal: m.txTest.refusal || "" };
        paintKeyTest();
      } else if (m.type === "txtest") onKeyStatus(m);
      else if (m.type === "level") paintLevel(m);
    };
    ws.onclose = function () {
      if (station.ws !== ws) return;
      station.ws = null;
      station.tx = null;
      paintKeyTest();
      clearTimeout(station.retry);
      station.retry = setTimeout(function () { if (stationNeeded()) openStation(); }, 2000);
    };
  }

  function closeStation() {
    clearTimeout(station.stale);
    clearTimeout(station.retry);
    if (station.ws) {
      var ws = station.ws;
      station.ws = null;
      ws.onclose = null;
      try { ws.close(); } catch (e) { /* already closed */ }
    }
    station.tx = null;
  }

  // ---- 4. Modes
  function drawStepModes(wrap) {
    wrap.appendChild(el("h1", null, "What do you want to talk to?"));
    wrap.appendChild(el("p", "lede", "Each choice adds a modem that listens and transmits in its own place on the band. You can add more than one."));
    var list = modemList();
    var holder = el("div");
    holder.id = "modems";
    if (list.length > 0) holder.appendChild(drawStrip());
    list.forEach(function (m, i) {
      var info = M.modeInfo(schema, M.get(m, "mode"));
      var row = el("div", "modemrow");
      row.id = "setup-modem-" + i;
      var sw = el("span", "swatch");
      sw.style.background = M.colourOf(i);
      row.appendChild(sw);
      var who = el("div", "who");
      who.appendChild(el("b", null, info ? info.name : String(M.get(m, "mode"))));
      who.appendChild(el("small", null, info ? "Talks to " + info.talksTo : ""));
      row.appendChild(who);
      var rm = el("button", "btn small", "Remove");
      rm.type = "button";
      rm.id = "setup-remove-" + i;
      rm.addEventListener("click", function () {

        if (list.length === 0) M.remove(doc, "modems");
        edited(true);
      });
      row.appendChild(rm);
      holder.appendChild(row);
    });
    wrap.appendChild(holder);

    var n = { path: "modems" };
    var card = el("div", "card");
    card.id = "picker";
    var head = el("div", "head");
    head.appendChild(el("span", "name", picker.group ? "Which one?" : list.length ? "Add another" : "Pick what you want to talk to"));
    card.appendChild(head);
    var body = el("div", "body");
    var choices = el("div", "choices");
    var order = M.setupGroupOrder(setup.kind);
    var tunableOnly = placedByDial();
    var ids = order.suggested.concat(setup.showAll ? order.rest : []);
    if (!picker.group) {
      ids.forEach(function (gid) {
        var g = schema.modes.groups.filter(function (x) { return x.id === gid; })[0];
        if (!g || M.modesOfGroup(schema, g.id, tunableOnly).length === 0) return;
        choices.appendChild(choice("group-" + g.id, g.title, g.blurb, function () {
          var modes = M.modesOfGroup(schema, g.id, tunableOnly);
          if (modes.length === 1) { addModem(n, modes[0].mode); return; }
          picker.group = g.id;
          render();
        }));
      });
      if (!setup.showAll) {
        choices.appendChild(choice("show-all", "Something else", "Show every kind of mode", function () { setup.showAll = true; render(); }));
      }
    } else {
      var nino = picker.group === "nino";
      M.modesOfGroup(schema, picker.group, tunableOnly).forEach(function (m) {
        var title = nino ? "NinoTNC mode " + m.ninoMode : m.name;
        var text = nino ? m.name : "Talks to " + m.talksTo;
        choices.appendChild(choice("mode-" + m.mode, title, text, function () { addModem(n, m.mode); }));
      });
      choices.appendChild(choice("back", "Back", "Choose something else to talk to", function () { picker.group = null; render(); }));
    }
    body.appendChild(choices);
    card.appendChild(body);
    wrap.appendChild(card);
  }

  // ---- 5. Your software
  function drawStepSoftware(wrap) {

  // ---- 6. Try it
  function drawStepTry(wrap) {

    fix.hidden = true;
