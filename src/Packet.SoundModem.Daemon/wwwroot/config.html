<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdn-soundmodem settings</title>
<style>
  :root {
    --bg: #0a0d11;
    --panel: #11161d;
    --raised: #161d26;
    --edge: #1e2632;
    --ink: #d9e2ea;
    --muted: #8793a0;
    --amber: #f5a83c;
    --trace: #56c8dd;
    --good: #7fd18b;
    --warn: #ffb86b;
    --bad: #ff9a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    --sans: system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  * { scrollbar-width: thin; scrollbar-color: #2a3441 #0d1117; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: var(--amber); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  code { font-family: var(--mono); font-size: 12.5px; color: #e8c88f; }
  [hidden] { display: none !important; }

  header.top { display: flex; align-items: center; gap: 16px; padding: 10px 18px; flex-wrap: wrap;
               background: var(--panel); border-bottom: 1px solid var(--edge); }
  .wordmark { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
  .wordmark b { color: var(--amber); font-weight: 600; }
  .wordmark span { color: var(--muted); }
  #source { color: var(--muted); font-size: 13.5px; }
  header .right { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 13.5px; }
  .ghost { background: none; border: 1px solid var(--edge); border-radius: 5px; padding: 4px 11px; font-size: 13.5px; }
  .ghost:hover:not(:disabled) { border-color: var(--muted); }
  .ghost.on { border-color: var(--amber); }

  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 54px); }
  nav.areas { border-right: 1px solid var(--edge); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  nav.areas a { color: var(--ink); padding: 7px 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  nav.areas a:hover { background: var(--raised); text-decoration: none; }
  nav.areas a.on { background: var(--raised); box-shadow: inset 2px 0 0 var(--amber); }
  nav.areas small { color: var(--muted); font-size: 12px; }
  nav.areas .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); display: inline-block; }
  nav.areas hr { border: 0; border-top: 1px solid var(--edge); margin: 10px 4px; }

  main { padding: 26px clamp(16px, 4vw, 44px) 190px; max-width: 960px; min-width: 0; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
  .lede { color: var(--muted); max-width: 62ch; margin-bottom: 24px; }
  .muted { color: var(--muted); }

  #loading { color: var(--muted); padding: 30px 18px; }
  #login { max-width: 420px; margin: 60px auto; padding: 20px; background: var(--panel);
           border: 1px solid var(--edge); border-radius: 6px; }
  #login p { color: var(--muted); margin-bottom: 12px; }
  #login input { width: 100%; margin-bottom: 10px; }
  #login .bad { color: var(--bad); }

  input, select, textarea {
    background: none; color: var(--ink); border: 0; padding: 7px 9px; font: inherit;
  }
  #login input { background: #0d1117; border: 1px solid var(--edge); border-radius: 5px; }
  input:focus, select:focus, textarea:focus { outline: none; }
  select option { background: #0d1117; }

  .btn { border-radius: 5px; padding: 7px 15px; border: 1px solid var(--edge); background: var(--raised); font-size: 14px; }
  .btn.primary { background: var(--amber); color: #1a1205; border-color: var(--amber); font-weight: 600; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; }
  .btn.small { padding: 3px 10px; font-size: 13px; }

  /* ---------------------------------------------------------- overview */
  .area { border-top: 1px solid var(--edge); padding: 18px 0 20px; display: grid;
          grid-template-columns: 190px 1fr auto; gap: 6px 22px; align-items: start; }
  .area h2 { font-size: 16px; font-weight: 600; }
  .area p { max-width: 62ch; overflow-wrap: anywhere; }
  .area p + p { margin-top: 4px; }
  .area .sub { color: var(--muted); font-size: 13.5px; }
  .edit { border: 1px solid var(--edge); border-radius: 5px; padding: 4px 12px; font-size: 13.5px; color: var(--ink); }
  .edit:hover { border-color: var(--amber); color: var(--amber); text-decoration: none; }

  /* ---------------------------------------------------------- an area */
  .card { border: 1px solid var(--edge); border-radius: 6px; margin-bottom: 14px; background: var(--panel); }
  .card > .head { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
  .card > .head .name { font-weight: 600; }
  .card > .head .spacer { flex: 1; }
  .card > .head .state { color: var(--muted); font-size: 13px; }
  .card > .intro { padding: 10px 16px 0; color: var(--muted); font-size: 13px; }
  .card > .body { padding: 14px 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px 22px; }
  .card > .absent { padding: 12px 16px; color: var(--muted); font-size: 13.5px; }
  .card .card { margin: 0; background: #0e131a; grid-column: 1 / -1; }
  .card > .body > div:not(.field) { grid-column: 1 / -1; }
  .card .note { grid-column: 1 / -1; color: var(--warn); font-size: 13px; }
  .inactive-note { padding: 8px 16px 0; color: var(--warn); font-size: 13px; }

  .field { min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field > label { display: block; font-size: 14px; margin-bottom: 4px; }
  .field > label.changed::after { content: " *"; color: var(--amber); }
  .input { display: flex; align-items: center; background: #0d1117; border: 1px solid var(--edge); border-radius: 5px; }
  .input:focus-within { border-color: var(--amber); }
  .input input, .input select { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13.5px; }
  .input textarea { flex: 1; min-width: 0; min-height: 70px; resize: vertical; font-family: var(--mono); font-size: 13px; }
  .input .unit { color: var(--muted); padding: 0 10px; font-size: 13px; white-space: nowrap; }
  .input.invalid { border-color: var(--bad); }
  .input .clear { background: none; border: 0; color: var(--muted); padding: 0 10px; font-size: 13px; }
  .input .clear:hover { color: var(--amber); }
  .field .keyname { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .field .keyname code { font-size: 11.5px; color: var(--muted); }
  .field .help { color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 4px; overflow-wrap: anywhere; }
  .field .help .dflt { color: #9aa6b2; }
  .field .err { color: var(--bad); font-size: 13px; margin-top: 4px; }

  details.more { grid-column: 1 / -1; font-size: 13.5px; }
  details.more > summary { cursor: pointer; color: var(--muted); }
  details.more > summary:hover { color: var(--ink); }
  details.more[open] > summary { margin-bottom: 14px; }
  details.more > .inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px 22px; }
  details.more.page { margin-top: 18px; padding: 0; }
  details.more.page > .inner { display: block; }
  .unknown { grid-column: 1 / -1; color: var(--warn); font-size: 13px; }

  .add { width: 100%; padding: 12px; border: 1px dashed var(--edge); border-radius: 6px; background: none; color: var(--muted); margin-bottom: 14px; }
  .add:hover { color: var(--amber); border-color: var(--amber); }

  .issue { margin-bottom: 18px; padding: 8px 11px; border-left: 2px solid var(--bad); background: #1b1210; font-size: 13.5px; max-width: 70ch; }
  .issue b { color: var(--bad); font-weight: 600; }

  /* ---------------------------------------------------------- earlier versions */
  .version { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--edge); }
  .version .when { flex: 1; min-width: 220px; }
  .version .when small { display: block; color: var(--muted); font-size: 13px; }
  .look { flex-basis: 100%; }
  .look pre { background: #0d1117; border: 1px solid var(--edge); border-radius: 5px; padding: 10px 12px; max-height: 360px; overflow: auto; font: 12.5px/1.45 var(--mono); }
  .look p { font-size: 13.5px; margin-bottom: 8px; }

  /* ---------------------------------------------------------- edit as text */
  #json { width: 100%; min-height: 62vh; background: #0d1117; border: 1px solid var(--edge); border-radius: 6px; font: 13px/1.45 var(--mono); padding: 10px 12px; }
  #json.invalid { border-color: var(--bad); }
  #json-bar { display: flex; gap: 12px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }

  /* ---------------------------------------------------------- pending changes */
  #pending { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--panel); border-top: 1px solid var(--edge);
             padding: 12px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #pending .what { flex: 1; min-width: 240px; font-size: 14px; overflow-wrap: anywhere; }
  #pending .what small { display: block; color: var(--muted); font-size: 13px; }
  #page-notice { color: var(--warn) !important; margin-top: 4px; }
  #changes.bad { color: var(--bad); }
  #result { font-size: 14px; }
  #result.bad { color: var(--bad); }
  #result.good { color: var(--good); }
  #result:empty { display: none; }

  /* ---------------------------------------------------------- modems and the band strip */
  .strip { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 16px 18px 10px; margin-bottom: 20px; }
  .strip .caption { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
  .strip .caption b { color: var(--ink); font-weight: 600; }
  .strip .view { min-height: 150px; }
  .strip svg { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; font-family: var(--sans); }
  .strip.stale svg { opacity: .6; }
  .strip .blk { cursor: grab; outline: none; }
  .strip .blk.fixed { cursor: default; }
  .strip .blk.dragging { cursor: grabbing; }
  .strip .blk:focus-visible rect.body { stroke: var(--amber); stroke-width: 2.5; stroke-dasharray: none; }
  .strip .key { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .strip .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .strip .problem { margin-top: 8px; color: var(--warn); font-size: 13px; }
  .modem > .head { flex-wrap: nowrap; align-items: flex-start; }
  .modem > .head .who { flex: 1; min-width: 0; }
  .modem > .head .line { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
  .modem > .head .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .modem > .head .sub { color: var(--muted); font-size: 13px; }
  .modem > .head .talks { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .modem > .head .btn { flex: none; }
  .modem .field .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .modem .field .hint:empty { display: none; }
  .modem .field .warntext { color: var(--warn); font-size: 12.5px; margin-top: 4px; }
  .input.warned { border-color: var(--warn); }
  .input.mono input { font-size: 14px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; grid-column: 1 / -1; }
  .choice { text-align: left; background: #0d1117; border: 1px solid var(--edge); border-radius: 6px; padding: 9px 12px; }
  .choice:hover { border-color: var(--muted); }
  .choice b { display: block; font-weight: 600; font-size: 14px; }
  .choice span { color: var(--muted); font-size: 12.5px; }


  /* ---------------------------------------------------------- found on this machine */
  .found { margin-bottom: 18px; }
  .found .lead { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
  .found .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
  .found .lead .btn { margin-left: auto; }
  .found .none { color: var(--muted); font-size: 13.5px; padding: 4px 0 8px; }
  .found .problem { color: var(--warn); font-size: 13px; margin-bottom: 8px; }
  .option { display: grid; grid-template-columns: 22px 1fr; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--edge);
            border-radius: 7px; margin-bottom: 8px; background: var(--panel); cursor: pointer; }
  .option:hover { border-color: var(--muted); }
  .option.picked { border-color: var(--amber); background: #17130c; }
  .option input[type=radio] { margin-top: 4px; accent-color: var(--amber); }
  .option b { font-weight: 600; }
  .option .detail { grid-column: 2; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
  .option .detail .mono { color: var(--ink); font-family: var(--mono); font-size: 12.5px; }
  .option .extra { grid-column: 2; margin-top: 6px; display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .option .extra .field { min-width: 150px; }
  .option .note { color: var(--warn); font-size: 13px; }
  .found .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .found .group { color: var(--muted); font-size: 12.5px; margin: 12px 0 6px; }
  @media (prefers-reduced-motion: no-preference) {
    .found .pulse.working { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  }


  /* ---------------------------------------------------------- guided setup */
  body.setup-mode nav.areas, body.setup-mode #source { display: none; }
  body.setup-mode .layout { grid-template-columns: 1fr; }
  body.setup-mode #pending { display: none !important; }
  body.setup-mode main { max-width: 760px; margin: 0 auto; width: 100%; padding-bottom: 80px; }
  .steps { display: flex; gap: 0; margin: 0 0 30px; list-style: none; flex-wrap: wrap; }
  .steps li { flex: 1; min-width: 92px; font-size: 13px; color: var(--muted); padding-top: 9px; border-top: 3px solid var(--edge); margin-right: 4px; }
  .steps li.done { border-top-color: var(--good); color: var(--ink); }
  .steps li.now { border-top-color: var(--amber); color: var(--ink); font-weight: 600; }
  .steps li.skip { opacity: .5; font-style: italic; }
  .steps li button { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; text-decoration: underline; text-decoration-color: var(--edge); }
  .steps li button:hover { color: var(--amber); }
  .setup h1 { font-size: 26px; }
  .setup .field { margin: 10px 0; }
  .setup .option .field { margin: 0; }
  .setup .summary { display: grid; grid-template-columns: 130px 1fr; gap: 6px 16px; padding: 14px 16px; border: 1px solid var(--edge); border-radius: 7px; background: var(--panel); margin-bottom: 14px; }
  .setup .summary dt { color: var(--muted); }
  .setup .summary dd { overflow-wrap: anywhere; }
  .tryit { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--edge); border-radius: 6px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .tryit .good { color: var(--good); }
  .tryit .bad { color: var(--bad); }
  .tryit .warn { color: var(--warn); }
  .stepnav { display: flex; justify-content: space-between; margin-top: 30px; gap: 12px; }
  .elsewhere { margin-top: 18px; font-size: 13.5px; color: var(--muted); }
  .setup .modemrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--edge); border-radius: 7px; margin-bottom: 8px; background: var(--panel); }
  .setup .modemrow .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .setup .modemrow .who { flex: 1; min-width: 0; }
  .setup .modemrow .who small { display: block; color: var(--muted); font-size: 13px; }
  .setup .stepnote.warn { color: var(--warn); }
  .setup small.muted { color: var(--muted); font-size: 12.5px; }
  .setup .stepnote { color: var(--muted); font-size: 13.5px; margin: 6px 0 14px; max-width: 62ch; }
  .meter { position: relative; height: 18px; background: #0c1016; border: 1px solid var(--edge); border-radius: 3px; overflow: hidden; margin: 8px 0 6px; }
  .meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(90,200,120,.30); }
  .meter .hot { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(226,80,60,.30); }
  .meter .bar { position: absolute; left: 0; top: 3px; bottom: 3px; width: 0; background: #7fd8a0; }
  .meter .bar.quiet { background: #6f7d8c; }
  .meter .bar.loud { background: #e2503c; }
  .meter .rms { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.55); }
  .levelread { font-family: var(--mono); font-size: 13px; }

  @media (max-width: 760px) {
    .strip { padding: 12px 12px 8px; }
    .layout { grid-template-columns: 1fr; }
    nav.areas { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--edge); padding: 8px; }
    nav.areas a { white-space: nowrap; }
    nav.areas hr { display: none; }
    .area { grid-template-columns: 1fr auto; }
    .area > div { grid-column: 1 / -1; grid-row: 2; }
    .edit { grid-column: 2; grid-row: 1; }
    main { padding-bottom: 260px; }
    body.setup-mode main { padding-bottom: 60px; }
    .steps li { min-width: 70px; font-size: 12px; }
    .setup .summary { grid-template-columns: 1fr; gap: 0; }
    .setup .summary dd { margin-bottom: 8px; }
    #pending .btn { flex: 1; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wordmark"><b>pdn-soundmodem</b> <span id="mode-word">settings</span></div>
  <span id="source"></span>
  <div class="right">
    <a href="#overview" id="skip-setup" hidden>Skip setup and edit settings directly</a>
    <button type="button" class="ghost" id="edit-text" hidden>Edit as text</button>
    <a href="./" id="station-link">Station page</a>
  </div>
</header>

<div id="loading">Loading the configuration...</div>

<form id="login" hidden>
  <p>This station has an <code>api.key</code>. Enter it to read and change the configuration.</p>
  <input type="password" id="key" autocomplete="current-password" placeholder="api key" autofocus>
  <p id="login-error" class="bad" hidden></p>
  <button class="btn primary" type="submit">Unlock</button>
</form>

<div class="layout" id="shell" hidden>
  <nav class="areas" id="nav" aria-label="Settings areas"></nav>
  <main id="form-view"></main>
</div>

<div id="pending" role="region" aria-label="Changes not yet applied" hidden>
  <div class="what">
    <div id="changes"></div>
    <small id="changes-note"></small>
    <small id="page-notice"></small>
    <div id="result"></div>
  </div>
  <button type="button" class="btn" id="revert">Discard</button>
  <button type="button" class="btn" id="try" title="Restarts the station on this configuration. The next restart after that goes back to the file.">Try until next restart</button>
  <button type="button" class="btn primary" id="save" title="Writes the config file, whose comments are not kept, and restarts the station.">Save and restart</button>
</div>

<!-- The form's model: everything about turning a configuration into fields and fields back into
     a configuration, with no DOM in it. The tests run this block on its own (ConfigPageTests), so
     anything that decides what a value becomes belongs here and not in the script below. -->
<script id="config-model">
var ConfigModel = (function () {
  "use strict";

  // Keys match without regard to case, as the daemon reads them. An existing key keeps the
  // spelling the file already has.
  function findKey(obj, name) {
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return null;
    var lower = name.toLowerCase();
    for (var k in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, k) && k.toLowerCase() === lower) return k;
    }
    return null;
  }

  function get(obj, name) {
    var k = findKey(obj, name);
    return k === null ? undefined : obj[k];
  }

  function set(obj, name, value) {
    var k = findKey(obj, name);
    obj[k === null ? name : k] = value;
  }

  function remove(obj, name) {
    var k = findKey(obj, name);
    if (k !== null) delete obj[k];
  }

  function isScalarKind(kind) {
    return kind === "string" || kind === "integer" || kind === "number" || kind === "boolean";
  }

  // What a field shows for a value. Absent and null both show as empty.
  function toText(key, value) {
    if (value === undefined || value === null) return "";
    if (key.kind === "json") return JSON.stringify(value, null, 2);
    if (key.kind === "array" && key.items && isScalarKind(key.items.kind)) {
      if (!Array.isArray(value)) return JSON.stringify(value);
      var lines = [];
      for (var i = 0; i < value.length; i++) lines.push(scalarText(value[i]));
      return lines.join("\n");
    }
    if (key.secret && value === HIDDEN) return "";
    return scalarText(value);
  }

  function scalarText(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "string") return v;
    if (typeof v === "number" || typeof v === "boolean") return String(v);
    return JSON.stringify(v);
  }

  // What a field's text means: { absent: true }, { value: ... } or { error: "..." }.
  function fromText(key, text) {
    if (key.kind === "json") {
      if (text.trim() === "") return { absent: true };
      try { return { value: JSON.parse(stripJsonc(text)) }; }
      catch (e) { return { error: "not valid JSON: " + e.message }; }
    }
    if (key.kind === "array") {
      var kind = key.items ? key.items.kind : "string";
      var parts = text.split("\n");
      var out = [];
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i].trim();
        if (p === "") continue;
        var one = scalarFromText(kind, p);
        if (one.error) return { error: "line " + (i + 1) + ": " + one.error };
        out.push(one.value);
      }
      return out.length === 0 ? { absent: true } : { value: out };
    }
    if (text === "") return { absent: true };
    return scalarFromText(key.kind, text);
  }

  function scalarFromText(kind, text) {
    var t = text.trim();
    switch (kind) {
      case "integer":
        if (!/^[+-]?\d+$/.test(t)) return { error: "a whole number" };
        return { value: parseInt(t, 10) };
      case "number":
        if (t === "" || !isFinite(Number(t))) return { error: "a number" };
        return { value: Number(t) };
      case "boolean":
        if (t === "true") return { value: true };
        if (t === "false") return { value: false };
        return { error: "true or false" };
      default:
        return { value: text };
    }
  }

  // JSONC to JSON: comments and trailing commas removed, strings left alone.
  function stripJsonc(text) {
    var out = "", i = 0, n = text.length;
    while (i < n) {
      var c = text[i];
      if (c === '"') {
        var j = i + 1;
        while (j < n && text[j] !== '"') j += text[j] === "\\" ? 2 : 1;
        out += text.slice(i, j + 1);
        i = j + 1;
      } else if (c === "/" && text[i + 1] === "/") {
        while (i < n && text[i] !== "\n") i++;
      } else if (c === "/" && text[i + 1] === "*") {
        var end = text.indexOf("*/", i + 2);
        i = end < 0 ? n : end + 2;
      } else {
        out += c;
        i++;
      }
    }
    return out.replace(/,(\s*[}\]])/g, "$1");
  }

  function parseDocument(text) {
    var value = JSON.parse(stripJsonc(text));
    if (!value || typeof value !== "object" || Array.isArray(value)) {
      throw new Error("a configuration is one JSON object, {...}");
    }
    return value;
  }

  // Whether a value counts as "set" in the file: present, and not null, an empty list or an
  // empty string. A section is set when the file has it, even as {}.
  function isSet(value) {
    if (value === undefined || value === null) return false;
    if (Array.isArray(value)) return value.length > 0;
    if (typeof value === "string") return value !== "";
    return true;
  }

  // The kind of audio device a document names: "monitor" for a file with a monitor section (a
  // site has no device), else the part of "device" before the colon when the daemon knows it as a
  // prefix, else a sound card ("alsa"), which is what claims every other name.
  function deviceKind(schema, doc) {
    if (isSet(get(doc, "monitor"))) return "monitor";
    var d = get(doc, "device");
    if (typeof d !== "string" || d === "") return "alsa";
    var at = d.toLowerCase().indexOf(":");
    if (at > 0) {
      var prefix = d.toLowerCase().slice(0, at);
      var kinds = schema.deviceKinds || [];
      if (prefix !== "alsa" && prefix !== "monitor" && kinds.indexOf(prefix) >= 0) return prefix;
    }
    return "alsa";
  }

  // Whether a key's "when" rule says it is worth drawing. Any one of the tests is enough. A key
  // with no rule always is.
  function applies(when, ctx, parent) {
    if (!when) return true;
    if (when.deviceKind && when.deviceKind.indexOf(deviceKind(ctx.schema, ctx.doc)) >= 0) return true;
    if (when.set) {
      for (var i = 0; i < when.set.length; i++) {
        if (isSet(valueAt(ctx.doc, when.set[i]))) return true;
      }
    }
    if (when.sibling) {
      var v = get(parent, when.sibling.key);
      if (!isSet(v)) v = when.sibling["default"];
      if (v !== undefined && v !== null && when.sibling["in"].indexOf(String(v).toLowerCase()) >= 0) return true;
    }
    return false;
  }

  // The fields for one object of type typeName: a tree the page draws as it is.
  //   field:   a scalar, scalar array or raw JSON key, with its path and text
  //   section: an object key; present says whether the document has it
  //   list:    an array of objects, one entry per element
  //   unknown: keys the document has that this daemon does not know; they are kept
  // Every node says whether the key is set (set), whether its "when" rule applies (applies), and
  // so whether to draw it (shown): a key the file sets is always drawn, so nothing in a file is
  // hidden from the person editing it; inactive marks one drawn though its rule does not apply.
  function plan(schema, typeName, obj, path, ctx) {
    ctx = ctx || { schema: schema, doc: obj };
    var type = schema.types[typeName];
    var nodes = [];
    var known = {};
    for (var i = 0; i < type.keys.length; i++) {
      var key = type.keys[i];
      known[key.name.toLowerCase()] = true;
      var p = path === "" ? key.name : path + "." + key.name;
      var value = get(obj, key.name);
      // An old name of a key is drawn only where a file still uses it.
      // So is raw JSON, which is a retired section ("mailcast") kept only so it is not lost.
      if ((key.aliasOf || key.kind === "json") && value === undefined) continue;
      var set = isSet(value);
      var fits = applies(key.when, ctx, obj);
      var shown = fits || set;
      var node;
      if (key.kind === "object" && key.ref) {
        var present = value !== undefined && value !== null && typeof value === "object";
        node = { node: "section", path: p, key: key, present: present,
                 children: plan(schema, key.ref, present ? value : {}, p, ctx) };
      } else if (key.kind === "array" && key.items && key.items.ref) {
        var items = [];
        var arr = Array.isArray(value) ? value : [];
        for (var j = 0; j < arr.length; j++) {
          items.push({ path: p + "[" + j + "]",
                       children: plan(schema, key.items.ref, arr[j] || {}, p + "[" + j + "]", ctx) });
        }
        node = { node: "list", path: p, key: key, items: items };
      } else if (isScalarKind(key.kind) || key.kind === "json"
                 || (key.kind === "array" && key.items && isScalarKind(key.items.kind))) {
        node = { node: "field", path: p, key: key, text: toText(key, value),
                 secretSet: !!key.secret && value === HIDDEN };
      } else {
        node = { node: "unsupported", path: p, key: key };
      }
      node.set = set;
      node.applies = fits;
      node.shown = shown;
      node.inactive = shown && !fits;
      nodes.push(node);
    }
    var extra = [];
    if (obj && typeof obj === "object") {
      for (var k in obj) {
        if (Object.prototype.hasOwnProperty.call(obj, k) && !known[k.toLowerCase()]) extra.push(k);
      }
    }
    if (extra.length > 0) nodes.push({ node: "unknown", path: path, names: extra, shown: true });
    return nodes;
  }

  // Walks a path such as "modems[1].identify.callsign" to the object holding its last key.
  function parentOf(doc, path, create) {
    var parts = splitPath(path);
    var obj = doc;
    for (var i = 0; i < parts.length - 1; i++) {
      var part = parts[i];
      var next = typeof part === "number" ? obj[part] : get(obj, part);
      if (next === undefined || next === null) {
        if (!create) return null;
        next = typeof parts[i + 1] === "number" ? [] : {};
        if (typeof part === "number") obj[part] = next; else set(obj, part, next);
      }
      obj = next;
    }
    return { obj: obj, last: parts[parts.length - 1] };
  }

  function splitPath(path) {
    var out = [];
    var re = /([^.[\]]+)|\[(\d+)\]/g, m;
    while ((m = re.exec(path)) !== null) out.push(m[2] !== undefined ? parseInt(m[2], 10) : m[1]);
    return out;
  }

  function valueAt(doc, path) {
    var at = parentOf(doc, path, false);
    if (!at) return undefined;
    return typeof at.last === "number" ? at.obj[at.last] : get(at.obj, at.last);
  }

  // Writes one field's text back into doc. Returns null, or the reason the text is not a value.
  // A secret left empty while one is set keeps it: the placeholder goes back, and the daemon
  // puts the stored value in its place.
  function writeField(doc, path, key, text) {
    var parsed = fromText(key, text);
    if (parsed.error) return parsed.error;
    if (key.secret && parsed.absent && valueAt(doc, path) === HIDDEN) return null;
    if (parsed.absent) {
      var at = parentOf(doc, path, false);
      if (at) remove(at.obj, at.last);
      return null;
    }
    var target = parentOf(doc, path, true);
    set(target.obj, target.last, parsed.value);
    return null;
  }

  // The paths at which two documents differ, for "3 changes: ..." above the buttons.
  function diff(a, b, path, out) {
    out = out || [];
    path = path || "";
    if (JSON.stringify(a) === JSON.stringify(b)) return out;
    var objA = a && typeof a === "object" && !Array.isArray(a);
    var objB = b && typeof b === "object" && !Array.isArray(b);
    if (objA && objB) {
      var seen = {};
      for (var k in a) {
        seen[k.toLowerCase()] = true;
        diff(a[k], get(b, k), path === "" ? k : path + "." + k, out);
      }
      for (var k2 in b) {
        if (!seen[k2.toLowerCase()]) diff(undefined, b[k2], path === "" ? k2 : path + "." + k2, out);
      }
      return out;
    }
    if (Array.isArray(a) && Array.isArray(b) && a.length === b.length) {
      for (var i = 0; i < a.length; i++) diff(a[i], b[i], path + "[" + i + "]", out);
      return out;
    }
    out.push(path === "" ? "(whole file)" : path);
    return out;
  }

  // A document with every section present and one entry in every list: the most a form can
  // be asked to draw. The tests use it to look for a key the page cannot show.
  function fullDocument(schema, typeName, depth) {
    typeName = typeName || schema.root;
    depth = depth || 0;
    var obj = {};
    if (depth > 8) return obj;
    var keys = schema.types[typeName].keys;
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      if (key.kind === "json") obj[key.name] = {};
      else if (key.aliasOf) obj[key.name] = key.kind === "boolean" ? true : key.kind === "string" ? "x" : 1;
      else if (key.kind === "object" && key.ref) obj[key.name] = fullDocument(schema, key.ref, depth + 1);
      else if (key.kind === "array" && key.items && key.items.ref) obj[key.name] = [fullDocument(schema, key.items.ref, depth + 1)];
    }
    return obj;
  }

  // ---------------------------------------------------------------- areas and words

  // The top-level nodes of a document, sorted into the page's areas. Each area has its fields
  // (plain values), its sections (objects and lists) and, in "advanced", the keys this version
  // does not know. A node says shown; one not shown is still listed, so a test can see that every
  // key has somewhere to be drawn.
  function areas(schema, doc) {
    var out = {};
    var order = schema.areas || [];
    for (var i = 0; i < order.length; i++) {
      out[order[i].id] = { id: order[i].id, title: order[i].title, fields: [], sections: [], unknown: [] };
    }
    var nodes = plan(schema, schema.root, doc, "");
    nodes.forEach(function (n) {
      if (n.node === "unknown") { out.advanced.unknown.push(n); return; }
      var id = n.key.area || "advanced";
      if (!out[id]) out[id] = { id: id, title: id, fields: [], sections: [], unknown: [] };
      (n.node === "field" ? out[id].fields : out[id].sections).push(n);
    });
    return out;
  }

  function labelOf(key) { return key.label || key.name; }

  // The plain name of one entry of a list: "modem", from the key's item or its label.
  function itemOf(key) { return key.item || labelOf(key).toLowerCase(); }

  function capital(text) { return text.charAt(0).toUpperCase() + text.slice(1); }

  // The key's name as the reference page spells it, without list positions: modems[].identify.
  function docPath(path) { return path.replace(/\[\d+\]/g, "[]"); }

  // What to call the setting at a path, in words: its label, "Sub-channel 2: Audio frequency" for
  // a modem's (the daemon's own refusals say "modem 2" for the sub-channel, so the page does too),
  // "Filter lower edge (UberSDR receiver)" for one in a section that makes it clearer. docs are
  // the documents to look a list entry up in, in order.
  function describePath(schema, path, docs) {
    if (path === "(whole file)") return "the whole file";
    var parts = splitPath(path);
    var typeName = schema.root;
    var list = "";
    var top = null;
    var label = path;
    var depth = 0;
    var prefix = "";
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (typeof part === "number") {
        prefix += "[" + part + "]";
        list = entryName(schema, top, typeName, part, prefix, docs || []);
        label = list;
        continue;
      }
      prefix = prefix === "" ? part : prefix + "." + part;
      var keys = schema.types[typeName] ? schema.types[typeName].keys : [];
      var key = null;
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].name.toLowerCase() === part.toLowerCase()) { key = keys[j]; break; }
      }
      if (!key) return path;
      if (top === null) top = key;
      depth++;
      label = labelOf(key);
      if (key.kind === "object" && key.ref) typeName = key.ref;
      else if (key.kind === "array" && key.items && key.items.ref) typeName = key.items.ref;
      if (i + 1 < parts.length && typeof parts[i + 1] === "number") top = key;
    }
    if (list !== "" && label !== list) return list + ": " + label;
    if (depth > 1 && list === "" && top && label.toLowerCase().indexOf(labelOf(top).toLowerCase()) < 0) {
      return label + " (" + labelOf(top) + ")";
    }
    return label;
  }

  // What to call one entry of a list: "Sub-channel 2" where entries have one (modems do), else
  // "Modem 3" from its position.
  function entryName(schema, listKey, itemType, index, prefix, docs) {
    var keys = schema.types[itemType] ? schema.types[itemType].keys : [];
    var hasSub = keys.some(function (k) { return k.name === "subChannel"; });
    if (hasSub) {
      for (var d = 0; d < docs.length; d++) {
        var entry = valueAt(docs[d], prefix);
        if (entry !== undefined && entry !== null) {
          var sub = get(entry, "subChannel");
          return "Sub-channel " + (sub === undefined || sub === null ? 0 : sub);
        }
      }
    }
    return capital(itemOf(listKey)) + " " + (index + 1);
  }

  // The part of a refusal worth showing. The daemon words its refusals for a journal: a first line
  // saying which file, the problem, then what to do about a file that will not start. A page that
  // is only checking a proposal wants the problem.
  function problemText(text) {
    var lines = String(text).replace(/\r/g, "").split("\n");
    if (/^configuration error in /.test(lines[0] || "")) {
      var out = [];
      for (var i = 1; i < lines.length; i++) {
        var t = lines[i].trim();
        if (t === "") break;
        out.push(t);
      }
      if (out.length > 0) return out.join(" ");
    }
    return String(text).trim();
  }

  // Finds the setting a refusal is about, by the key names it quotes: "waterfall"."port" is
  // waterfall.port, a bare "txAmplitude" after "modem 1" is that modem's, and a message that
  // names no key but says "unknown mode" under "modem 0" is that modem's mode. Returns
  // { path, problem }, with path null when nothing in the message matches a key of this schema.
  function locateIssue(schema, doc, text) {
    var problem = problemText(text);
    var modem = /\bmodem (\d+)\b/i.exec(problem);
    var modemAt = null;
    if (modem) {
      var list = get(doc, "modems");
      if (Array.isArray(list)) {
        for (var m = 0; m < list.length; m++) {
          if (list[m] && Number(get(list[m], "subChannel") === undefined ? 0 : get(list[m], "subChannel")) === Number(modem[1])) { modemAt = m; break; }
        }
      }
    }

    function find(typeName, name) {
      var keys = schema.types[typeName] ? schema.types[typeName].keys : [];
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].name.toLowerCase() === name.toLowerCase()) return keys[j];
      }
      return null;
    }

    function resolve(names) {
      var typeName = schema.root;
      var path = "";
      for (var i = 0; i < names.length; i++) {
        var key = find(typeName, names[i]);
        if (!key) return null;
        path = path === "" ? key.name : path + "." + key.name;
        if (key.kind === "object" && key.ref) typeName = key.ref;
        else if (key.kind === "array" && key.items && key.items.ref) typeName = key.items.ref;
        else if (i < names.length - 1) return null;
      }
      return path;
    }

    function inModem(name) {
      return modemAt !== null && find("ModemConfig", name) ? "modems[" + modemAt + "]." + find("ModemConfig", name).name : null;
    }

    var quoted = problem.match(/"[A-Za-z][A-Za-z0-9.]*"(?:\."[A-Za-z][A-Za-z0-9]*")*/g) || [];
    for (var q = 0; q < quoted.length; q++) {
      var names = quoted[q].replace(/"/g, "").split(".");
      var path = (names.length === 1 && inModem(names[0])) || resolve(names);
      if (path) return { path: path, problem: problem };
    }
    if (modemAt !== null) {
      var words = problem.match(/[A-Za-z][A-Za-z0-9]*/g) || [];
      for (var w = 0; w < words.length; w++) {
        if (words[w].toLowerCase() === "modem" || words[w].toLowerCase() === "modems") continue;
        var found = inModem(words[w]);
        if (found) return { path: found, problem: problem };
      }
    }
    return { path: null, problem: problem };
  }

  // The area a path belongs to: the area of its top-level key.
  function areaOf(schema, path) {
    var parts = splitPath(path);
    var keys = schema.types[schema.root].keys;
    for (var i = 0; i < keys.length; i++) {
      if (parts.length > 0 && typeof parts[0] === "string" && keys[i].name.toLowerCase() === parts[0].toLowerCase()) {
        return keys[i].area || "advanced";
      }
    }
    return "advanced";
  }

  // The settings that differ between two documents, as words for the pending-changes bar: each
  // label once, however many keys under it changed.
  function changedLabels(schema, a, b) {
    var seen = {};
    var out = [];
    diff(a, b).forEach(function (path) {
      var label = describePath(schema, path, [b, a]);
      if (!seen[label]) { seen[label] = true; out.push(label); }
    });
    return out;
  }

  function valueWords(key, value) {
    if (key.secret) return "set";
    if (Array.isArray(value)) return value.length + (value.length === 1 ? " entry" : " entries");
    if (value === true) return "on";
    if (value === false) return "off";
    var text = scalarText(value);
    return key.unit ? text + " " + key.unit : text;
  }

  // A plain sentence or two for the overview: what an area has set, with nothing worked out
  // from what the settings mean. (Sentences that do are for a later phase.)
  function summary(schema, doc, areaId) {
    var group = areas(schema, doc)[areaId];
    if (!group) return [];
    var facts = [];
    var more = [];
    group.fields.forEach(function (n) {
      if (!n.set) return;
      var value = valueAt(doc, n.path);
      var line = labelOf(n.key) + ": " + valueWords(n.key, value);
      if (n.key.advanced && areaId !== "advanced") more.push(labelOf(n.key));
      else facts.push(line);
    });
    group.sections.forEach(function (n) {
      if (n.node === "list") {
        if (n.items.length === 0) return;
        var names = n.items.map(function (item) {
          var entry = valueAt(doc, item.path) || {};
          return get(entry, "mode") || get(entry, "callsign") || get(entry, "path") || get(entry, "port") || "";
        }).filter(function (x) { return x !== ""; });
        facts.push(labelOf(n.key) + ": " + n.items.length + (names.length > 0 ? " (" + names.join(", ") + ")" : ""));
      } else if (n.present) {
        facts.push(labelOf(n.key) + " is set up");
      }
    });
    var out = [];
    if (facts.length === 0 && more.length === 0) {
      out.push("Nothing is set here, so the station uses its defaults.");
    } else {
      if (facts.length > 0) out.push(facts.slice(0, 5).join(". ") + "." + (facts.length > 5 ? " And " + (facts.length - 5) + " more." : ""));
      if (more.length > 0) out.push("Also set: " + more.join(", ") + ".");
    }
    return out;
  }

  // What a change does to the station page this page is served from, if anything: it goes away
  // (the waterfall section removed), or it moves (its port, or the address it listens on, changed).
  // For a move, the address it will answer at after the restart, when this browser can reach it.
  function pageMove(loaded, doc, hostname, protocol) {
    var before = get(loaded, "waterfall"), after = get(doc, "waterfall");
    if (isSet(before) && !isSet(after)) return { kind: "removed" };
    if (!isSet(before) || !isSet(after)) return null;
    function port(d) {
      var p = get(get(d, "waterfall"), "port");
      return p === undefined || p === null ? 8107 : p;
    }
    function bind(d) {
      var b = get(d, "bind");
      return typeof b === "string" && b !== "" ? b : "127.0.0.1";
    }
    if (port(loaded) === port(doc) && bind(loaded) === bind(doc)) return null;
    var b = bind(doc);
    var loopback = b === "127.0.0.1" || b === "::1" || b === "localhost";
    var viewerLocal = hostname === "localhost" || hostname === "127.0.0.1" || hostname === "[::1]";
    var host = hostname;
    if (!loopback && b !== "*" && b !== "0.0.0.0" && b !== "::") host = b.indexOf(":") >= 0 ? "[" + b + "]" : b;
    var reachable = !loopback || viewerLocal;
    return { kind: "moved", port: port(doc), bind: b, loopback: loopback,
             url: reachable ? protocol + "//" + host + ":" + port(doc) + "/config" : null,
             local: "http://127.0.0.1:" + port(doc) + "/config" };
  }

  // Whether the document turns a station into a monitor site: it has a monitor section the
  // loaded one did not. A monitor does not serve this page (the daemon dispatches to the monitor
  // host before the configuration page is built), so the page would be gone after the restart.
  function becomesMonitor(loaded, doc) {
    return !isSet(get(loaded, "monitor")) && isSet(get(doc, "monitor"));
  }

  // What the secrets that differ in a restored version are called, by their paths. Names only:
  // the page never holds a secret's value.
  var SECRET_WORDS = {
    "api.key": "access key",
    "publish.token": "monitor token",
    "ubersdr.password": "UberSDR password"
  };
  function secretWords(paths) {
    return (paths || []).map(function (p) { return SECRET_WORDS[p] || p; });
  }

  function newItem() { return {}; }

  // ---------------------------------------------------------------- frequencies and the band strip
  // All of this is arithmetic on numbers the plan endpoint returned (or the operator typed), with
  // no DOM, so the tests can run it. "Position" is a place on the strip's axis: a radio frequency
  // in Hz where the station has a dial, an audio frequency in Hz where it has none (FM).

  var SNAP_HZ = 100;

  var COLOURS = ["#f5a83c", "#56c8dd", "#b79bff", "#7fd18b", "#ff9a7a", "#e0d36a", "#6fa8ff", "#e58fd0"];

  function colourOf(index) { return COLOURS[index % COLOURS.length]; }

  // 7050800 -> "7.050800": MHz to the Hz, as a frequency is dialled.
  function mhzText(hz) { return (Math.round(hz) / 1e6).toFixed(6); }

  // "7.0508" -> { value: 7050800 }, or { error, hint } for text that is not a frequency in MHz.
  // Anything outside 0.1 to 1300 MHz (the top of the 23 cm band) is refused: 3580 typed in kHz, or
  // 7050800 in Hz, would otherwise be taken as that many MHz.
  function mhzFromText(text) {
    var t = String(text).trim();

  // ---------------------------------------------------------------- what this machine has

    var s = found && found[name];

  function listWords(names) { return names.join(", "); }

  // What the Radio and audio area offers: the sound cards, and the FlexRadios on the LAN. (UberSDR
  // receivers are offered from a list of their own, see uberChoices.)
  function radioChoices(found) {
    var out = [];
    section(found, "soundCards").forEach(function (c) {
      var bits = [c.device];
      if (c.cm108) bits.push(c.kind === "aioc" ? "an AIOC, which can key the radio too" : "a CM108 interface, which can key the radio too");
      if (!c.capture) bits.push("playback only");
      if (!c.playback) bits.push("record only");

      var rec = c.captureControls || [];
      var play = c.playbackControls || [];
      if (rec.length > 0 || play.length > 0) {
        detail += " Mixer: " + (rec.length ? "record " + listWords(rec) : "") + (rec.length && play.length ? "; " : "")
          + (play.length ? "play " + listWords(play) : "") + ".";
      }
      out.push({ id: "card-" + c.id, kind: "soundcard", title: c.name, detail: detail, device: c.device,
        section: null, ownKeying: false });
    });
    section(found, "flexRadios").forEach(function (f) {
      var name = f.name || f.model || "FlexRadio";
      out.push({ id: "flex-" + (f.serial || f.ip), kind: "flex", title: "FlexRadio " + name,
        detail: (f.model ? f.model + " at " : "") + f.ip + ". It keys itself, so no PTT is needed.",
        device: f.device, section: { name: "flex", value: {} }, ownKeying: true });
    });
    return out;
  }

  function uberChoices(found) {
    return section(found, "uberSdr").map(function (u) {
      var where = u.location ? ", " + u.location : "";
      return { id: "ubersdr-" + u.host, kind: "ubersdr", title: (u.name || u.host) + where + (u.free ? "" : " (full)"),
        detail: u.device, device: u.device, section: { name: "ubersdr", value: { mode: "iq48" } }, ownKeying: true };
    });
  }

  // What choosing a Flex or an UberSDR takes out of the document, as a list of {words, apply}: the
  // reference refuses these settings beside such a device, so leaving them would give a
  // configuration the station will not start on. A Flex keys itself and an UberSDR has no
  // transmitter. Only what is set is listed. Every one is said beside the choice and again in the
  // pending bar, because publish and identify are real work to lose.
  function radioRemovals(doc, choice) {
    var out = [];
    if (!choice.ownKeying) return out;
    function drop(name, words) {
      if (isSet(get(doc, name))) out.push({ words: words, apply: function () { remove(doc, name); } });
    }
    drop("ptt", "the push to talk setting");
    drop("rig", "the rig control section");
    drop("captureDevice", "the separate receive sound card");
    drop("playbackDevice", "the separate transmit sound card");
    var alsa = get(doc, "alsa");
    if (alsa && typeof alsa === "object" && isSet(get(alsa, "mixer"))) {

        remove(alsa, "mixer");

      } });

    // it goes too: the setting means nothing once the rig is gone, and the modem is then planned
    // with the others.
    var lease = get(doc, "modems");

  // The sentence said beside a choice about what picking it takes out or leaves, or "".

  // Writes the ptt section a choice stands for, as the reference spells it. gpio 3 and line rts

  // ---------------------------------------------------------------- guided setup

  var SETUP_STEPS = [

    { id: "card", title: "Sound card" },
    { id: "keying", title: "Keying" },
    { id: "modes", title: "Modes" },
    { id: "software", title: "Your software" },

  // What kind of audio device "device" names: a card, a FlexRadio or a web receiver.

    for (i = at - 1; i >= 0; i--) if (!steps[i].skipped) return steps[i].id;

  // A document with what setup chooses taken out, for a station that has never been set up: the
  // shipped example's choices are placeholders, not a decision, so setup starts from nothing and
  // keeps the rest (the page's port, the access key).
  function setupClearChoices(doc) {
    ["device", "captureDevice", "playbackDevice", "ptt", "rig", "modems", "sideband", "flex", "ubersdr"]
      .forEach(function (name) { remove(doc, name); });
  }

  // Chooses the kind of radio. A sound-card kind takes a Flex or a web receiver device out, and a
  // Flex or web receiver kind takes out a device of the wrong kind; the receiver itself is picked
  // beside it afterwards, with pickRadio. FM is a kind of radio (sideband), not a device.
  function setupPickKind(doc, kind) {
    var have = deviceFamily(doc);
    var want = kind === "flex" || kind === "ubersdr" ? kind : "card";
    if (have !== want) {
      remove(doc, "device");
      remove(doc, "flex");
      remove(doc, "ubersdr");
    }
    var side = get(doc, "sideband");
    if (kind === "fm") set(doc, "sideband", "fm");
    else if (typeof side === "string" && side.toLowerCase() === "fm") remove(doc, "sideband");
  }

  // Whether a step has what it needs for Next. flags.keying: a way of keying has been chosen.
  function setupComplete(doc, kind, id, flags) {
    flags = flags || {};
    var modems = get(doc, "modems");
    if (id === "radio") {
      if (!kind) return false;
      return kind === "flex" || kind === "ubersdr" ? deviceFamily(doc) === kind : true;
    }
    if (id === "card") return deviceFamily(doc) === "card" && isSet(get(doc, "device"));
    if (id === "keying") return flags.keying === true;
    if (id === "modes") return (Array.isArray(modems) && modems.length > 0) || isSet(get(doc, "ardop"));
    if (id === "software") return setupKissProblem(doc) === "";
    return true;
  }

  function setupKissPort(doc) {
    var p = get(doc, "kissPort");
    return typeof p === "number" ? p : 8105;
  }

  function setupKissProblem(doc) {
    var p = setupKissPort(doc);
    return p >= 1 && p <= 65535 && Math.floor(p) === p ? "" : "The port is a whole number from 1 to 65535.";
  }

  // Whether the KISS port is open beyond this machine. No bind, or a loopback one, is this
  // machine only.
  function setupNetwork(doc) {
    var b = get(doc, "bind");
    if (!isSet(b)) return false;
    b = String(b).toLowerCase();
    return !(b === "127.0.0.1" || b === "::1" || b === "localhost");
  }

  // Writes the KISS port and who may reach it. Returns "" or the reason it wrote nothing. The
  // default bind (this machine only) is left out of the file; a network bind someone already
  // chose, such as one interface's address, is kept.
  function setupWriteSoftware(doc, portText, network) {
    var t = String(portText).trim();
    if (!/^\d+$/.test(t) || parseInt(t, 10) < 1 || parseInt(t, 10) > 65535) {
      return "The port is a whole number from 1 to 65535.";
    }
    set(doc, "kissPort", parseInt(t, 10));
    if (network) { if (!setupNetwork(doc)) set(doc, "bind", "*"); }
    else remove(doc, "bind");
    return "";
  }

  // What to point other software at, in words: where the KISS port is, from the page's hostname.
  function setupSoftwareWords(doc, hostname) {
    var network = setupNetwork(doc);
    var port = setupKissPort(doc);
    var host = network ? (hostname && hostname !== "localhost" ? hostname : "this machine's address") : "127.0.0.1";
    return { host: host, port: port, network: network,
      text: "Point LinBPQ, a Dire Wolf client or any other KISS over TCP software at " + host + " port " + port
        + (network ? "." : ". Only programs on this machine can reach it.") };
  }

  // What opening the KISS port to the network really opens: every listener, not just KISS.
  function setupNetworkWarning(doc) {
    var api = get(doc, "api");
    var keyed = isSet(api) && isSet(get(api, "key"));
    return "This opens every listener on this machine to your network: the KISS port, the station page with its transmit test, and this settings page. "
      + (keyed ? "Anyone on the network who has the access key can change settings and key the radio."
               : "This station has no access key, so anyone on the network can change its settings and key the radio. Set an access key first.");
  }

  // The kinds of mode the "what do you want to talk to?" step suggests first for a kind of radio.
  function setupGroupOrder(kind) {
    var fm = ["p1200", "p9600", "nino", "ofdmfm"];
    var hf = ["hf300", "hffast", "hfdata", "ardop"];
    return kind === "fm" ? { suggested: fm, rest: hf } : { suggested: hf, rest: fm };
  }

  function sameChoices(a, b) {
    return ["device", "captureDevice", "playbackDevice", "ptt", "rig"].every(function (name) {
      return JSON.stringify(get(a, name) === undefined ? null : get(a, name))
        === JSON.stringify(get(b, name) === undefined ? null : get(b, name));
    });
  }

  // Whether "Key the radio for 2 seconds" can run, and if not why, in plain words. The test keys
  // the station as it is running, so it can only test settings the station already has: what the
  // person has chosen in setup but not saved is not what would be keyed.
  function keyTestState(loaded, doc, tx) {
    if (!tx) return { ok: false, why: "Asking the station whether it can key the radio..." };
    if (tx.available !== true) {
      var why = tx && tx.refusal ? " The station says: " + tx.refusal + "." : "";
      return { ok: false, why: "The station cannot key the radio yet." + why
        + " Once setup is saved the test is on the last screen." };
    }
    if (!sameChoices(loaded, doc)) {
      return { ok: false, why: "The test keys the radio the way the station is set up now, and you have changed that. "
        + "Save and start first; the same test is on the last screen." };
    }
    return { ok: true, why: "" };
  }

  // The lines of the summary on the last step: [label, words].
  function setupSummary(schema, doc, kind, found) {
    var rows = [];
    var kinds = { fm: "A sound card into an FM radio", ssb: "A sound card into an SSB radio",
      flex: "A FlexRadio", ubersdr: "A web receiver (UberSDR)", other: "A receiver set up in the settings" };
    rows.push(["Radio", kinds[kind] || "Not chosen"]);
    var dev = get(doc, "device");
    var card = kind === "fm" || kind === "ssb" ? cardOfDevice(dev, section(found, "soundCards")) : null;
    // A card is named, with its device string as the small print; anything else is its string.
    rows.push([kind === "flex" ? "FlexRadio" : kind === "ubersdr" || kind === "other" ? "Receiver" : "Sound card",
      card ? card.name : isSet(dev) ? String(dev) : "Not chosen", card ? String(dev) : ""]);
    var ptt = get(doc, "ptt");
    var keying;
    if (kind === "ubersdr" || kind === "other") keying = "Receive only, nothing is transmitted";
    else if (kind === "flex") keying = "The FlexRadio keys itself";
    else if (!ptt || typeof ptt !== "object") keying = "The radio's VOX, or nothing";
    else {
      var type = String(get(ptt, "type") || "serial").toLowerCase();
      keying = type === "cm108" ? "The sound card's PTT pin, " + get(ptt, "device")
        : type === "serial" ? "A serial port, " + get(ptt, "device")
        : type === "rigctld" ? "Hamlib's rigctld" : type;
    }
    rows.push(["Keying", keying]);
    var modems = get(doc, "modems");
    var names = (Array.isArray(modems) ? modems : []).map(function (m) {
      var info = modeInfo(schema, get(m, "mode"));
      return info ? info.name : String(get(m, "mode"));
    });
    rows.push(["Modes", names.length ? names.join(", ") : "None yet"]);
    rows.push(["Your software", "KISS port " + setupKissPort(doc) + ", " + (setupNetwork(doc) ? "reachable from your network" : "this machine only")]);
    return rows;
  }

  var HIDDEN = "(set, not shown)";

  return {
    findKey: findKey, get: get, set: set, remove: remove,
    toText: toText, fromText: fromText, stripJsonc: stripJsonc, parseDocument: parseDocument,
    plan: plan, writeField: writeField, valueAt: valueAt, splitPath: splitPath,
    parentOf: parentOf, diff: diff, fullDocument: fullDocument, newItem: newItem,
    isSet: isSet, deviceKind: deviceKind, areas: areas, labelOf: labelOf, itemOf: itemOf,
    docPath: docPath, describePath: describePath, problemText: problemText,
    locateIssue: locateIssue, areaOf: areaOf, pageMove: pageMove, becomesMonitor: becomesMonitor, secretWords: secretWords, changedLabels: changedLabels, summary: summary,
    mhzText: mhzText, mhzFromText: mhzFromText, snap: snap, toneHz: toneHz, dragTo: dragTo,
    keyDelta: keyDelta, keyMove: keyMove, dragMoved: dragMoved, blockLimits: blockLimits, layoutLimits: layoutLimits, nudged: nudged, freeCentre: freeCentre, nextSubChannel: nextSubChannel,
    newModem: newModem, modeInfo: modeInfo, modesOfGroup: modesOfGroup, stripLayout: stripLayout,
    stripCaption: stripCaption, colourOf: colourOf,
    cardOfDevice: cardOfDevice, radioChoices: radioChoices, uberChoices: uberChoices, pickRadio: pickRadio, radioRemovals: radioRemovals, radioNote: radioNote,
    keyingChoices: keyingChoices, keyingPicked: keyingPicked, pickKeying: pickKeying,
    setupSteps: setupSteps, setupNext: setupNext, setupPrev: setupPrev, setupKindOf: setupKindOf, setupClearChoices: setupClearChoices,
    setupPickKind: setupPickKind, setupComplete: setupComplete, setupWriteSoftware: setupWriteSoftware, setupKissPort: setupKissPort,
    setupNetwork: setupNetwork, setupSoftwareWords: setupSoftwareWords, setupGroupOrder: setupGroupOrder, keyTestState: keyTestState,
    setupSummary: setupSummary, setupNetworkWarning: setupNetworkWarning, setupDeviceKind: deviceFamily,
    setHidden: function (h) { HIDDEN = h; }
  };
})();
</script>

<script>
(function () {
  "use strict";
  var M = ConfigModel;
  var DOCS = "https://github.com/packet-net/pdn-soundmodem/blob/main/docs/reference/";
  var KEY_STORE = "pdn-soundmodem-config-key";
  var SKIP_STORE = "pdn-soundmodem-skip-setup:" + location.host;   // per station, and kept

  var BLURB = {
    radio: "The radio or receiver this station listens through, and the sound card or stream that carries its audio.",
    keying: "How the station keys the radio, and how it knows the channel is busy.",
    modes: "Each modem listens and transmits on its own frequency inside what the radio can hear. Drag a block on the band, or type the frequency.",
    software: "The ports your node and BBS software connect to.",
    sharing: "The station page, who may change settings, what is kept, and whether this station is shown on a public monitor.",
    advanced: "Settings most stations never touch.",
    monitor: "This file runs a monitor site rather than a station."
  };

  var schema = null;     // what /api/config/schema served
  var loaded = null;     // the configuration as the station served it
  var doc = null;        // the configuration being edited
  var errors = {};       // path -> reason, for fields whose text is not a value
  var textInvalid = false;
  var instance = null;   // which daemon process answered the last read
  var busy = false;
  var check = { state: "idle", seq: 0, problem: "", path: null };
  var checkTimer = null;
  var moreOpen = {};     // details that were open, by path
  var history = { list: null, stale: true, docs: {} };
  var lastArea = "overview";
  var restoredSecrets = []; // the secrets (by path) that differ between that version and the running one
  var restoredFrom = null; // the earlier version the document was loaded from, if it was

  var $ = function (id) { return document.getElementById(id); };

  function key() { return sessionStorage.getItem(KEY_STORE) || ""; }

  function api(path, options) {
    options = options || {};
    var headers = options.headers || {};
    if (key()) headers["Authorization"] = "Bearer " + key();
    options.headers = headers;
    return fetch(path, options);
  }

  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function idFor(path) { return "f-" + path.replace(/[^A-Za-z0-9]/g, "_"); }

  // ---------------------------------------------------------------- loading
  function load() {
    $("loading").hidden = false;
    var schemaReady = schema ? Promise.resolve(schema)
      : fetch("api/config/schema").then(function (r) {
          if (!r.ok) throw new Error("the station did not serve its settings list (HTTP " + r.status + ")");
          return r.json();
        });
    return schemaReady.then(function (s) {
      schema = s;
      M.setHidden(s.hidden);
      return api("api/config");
    }).then(function (r) {
      if (r.status === 401) {
        var had = !!key();
        sessionStorage.removeItem(KEY_STORE);
        showLogin(had ? "That is not this station's key." : "");
        return null;
      }
      if (r.status === 404) throw new Error("this station has no configuration file to edit (it was started without --config)");
      if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
      return r.json();
    }).then(function (answer) {
      if (!answer) return;
      instance = answer.instance || null;
      neverConfigured = !!(answer.setup && answer.setup.neverConfigured);
      loaded = answer.running || {};
      doc = clone(loaded);
      plan.data = null;
      plan.error = "";
      plan.overrides = {};
      autoChosen = {};
      restoredFrom = null;
      restoredSecrets = [];
      errors = {};
      textInvalid = false;
      check = { state: "idle", seq: check.seq + 1, problem: "", path: null };
      $("source").textContent = answer.source === "ephemeral"
        ? "running a one-run change; the next restart goes back to " + answer.configPath
        : answer.configPath;
      $("login").hidden = true;
      $("loading").hidden = true;
      $("shell").hidden = false;
      $("edit-text").hidden = false;
      history.stale = true;
      found = { state: "idle", data: null, error: "", seq: found.seq + 1 };
      pickRemoved = [];
      if (neverConfigured && !location.hash && !localStorage.getItem(SKIP_STORE) && !setup.active) location.hash = "#setup";
      render();
      fetchHistory().then(function () { renderNav(); });
    }).catch(function (e) {
      $("loading").hidden = false;
      $("loading").textContent = "Could not load the configuration: " + e.message;
    });
  }

  function showLogin(message) {
    $("loading").hidden = true;
    $("shell").hidden = true;
    $("pending").hidden = true;
    $("login").hidden = false;
    $("login-error").hidden = !message;
    $("login-error").textContent = message;
    $("key").focus();
  }

  $("login").addEventListener("submit", function (e) {
    e.preventDefault();
    sessionStorage.setItem(KEY_STORE, $("key").value);
    load();
  });

  function fetchHistory() {
    history.stale = false;
    return api("api/config/history").then(function (r) {
      return r.ok ? r.json() : { versions: [] };
    }).then(function (a) {
      history.list = a.versions || [];
    }).catch(function () {
      history.list = history.list || [];
    });
  }

  // ---------------------------------------------------------------- routes
  function route() {
    var id = location.hash.replace(/^#/, "");
    if (id === "history" || id === "text" || id === "overview" || id === "setup") return id;
    var list = schema ? schema.areas : [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return id;
    return "overview";
  }

  window.addEventListener("hashchange", function () {
    if (!doc) return;
    if (lastArea === "text" && textInvalid && route() !== "text") {
      location.hash = "#text";
      result("bad", "The text is not valid JSON yet. Fix it, or discard the changes, before leaving.");
      return;
    }
    if (route() === "history") history.stale = true;
    render();
    window.scrollTo(0, 0);
  });

  $("edit-text").addEventListener("click", function () {
    location.hash = route() === "text" ? "#overview" : "#text";
  });

  // ---------------------------------------------------------------- found on this machine
  // What /api/config/discover says the machine has, offered as choices above the fields. A choice
  // only fills the fields in; they stay as they were to type into.
  var found = { state: "idle", data: null, error: "", seq: 0 };
  var pickRemoved = [];  // what the last pick of a radio took out, said in the pending bar

  function look(fresh) {
    var seq = ++found.seq;
    found.state = "loading";
    paintFound();
    return api("api/config/discover" + (fresh ? "?fresh=1" : "")).then(function (r) {
      if (r.status === 401) { load(); return null; }
      if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
      return r.json();
    }).then(function (d) {
      if (seq !== found.seq || !d) return;
      found.data = d;
      found.state = "done";
      paintFound();
    }).catch(function (e) {
      if (seq !== found.seq) return;
      found.state = "failed";
      found.error = e.message;
      paintFound();
    });
  }

  function option(id, picked, title, detail, onPick, note, group) {
    var label = el("label", "option" + (picked ? " picked" : ""));
    label.id = "option-" + id;
    var radio = el("input");
    radio.type = "radio";
    radio.name = group || "found-choice";
    radio.id = "pick-" + id;
    radio.checked = picked;
    radio.addEventListener("change", function () { if (radio.checked) onPick(); });
    label.appendChild(radio);
    label.appendChild(el("b", null, title));
    label.appendChild(el("span", "detail", detail));
    if (note) {
      var n = el("span", "detail note", note);
      n.id = "note-" + id;
      label.appendChild(n);
    }
    return label;
  }

  function paintFound() {
    var box = $("found");
    if (!box || !doc) return;
    var inSetup = route() === "setup";
    var keying = route() === "keying" || (inSetup && setup.step === "keying");
    box.textContent = "";
    var lead = el("div", "lead");
    lead.appendChild(el("span", "pulse" + (found.state === "loading" ? " working" : "")));
    lead.appendChild(el("span", null, found.state === "loading" ? "Looking at this machine..."
      : found.state === "failed" ? "Could not look at this machine: " + found.error
      : "Found on this machine just now"));
    var again = el("button", "btn small", "Look again");
    again.type = "button";
    again.id = "look-again";
    again.disabled = found.state === "loading";
    again.addEventListener("click", function () { look(true); });
    lead.appendChild(again);
    box.appendChild(lead);
    if (found.state !== "done") return;
    var d = found.data;
    (keying ? ["hidDevices", "serialPorts"] : ["soundCards", "flexRadios", "uberSdr"]).forEach(function (name) {
      if (d[name] && d[name].problem) {
        var p = el("div", "problem", { soundCards: "Sound cards", hidDevices: "PTT pins", serialPorts: "Serial ports",
          flexRadios: "FlexRadios", uberSdr: "UberSDR receivers" }[name] + ": " + d[name].problem + ".");
        box.appendChild(p);
      }
    });
    if (inSetup && setup.step === "radio") paintRadio(box, d, setup.kind);
    else if (inSetup && setup.step === "card") paintRadio(box, d, "soundcard");
    else if (keying) paintKeying(box, d);
    else paintRadio(box, d);
  }

  function paintRadio(box, d, only) {
    var device = M.get(doc, "device");
    var choices = M.radioChoices(d);
    if (only) {
      var want = only === "flex" ? "flex" : only === "soundcard" ? "soundcard" : null;
      choices = want ? choices.filter(function (c) { return c.kind === want; }) : [];
    }
    if (choices.length === 0 && (!only || only === "soundcard" || only === "flex")) {
      box.appendChild(el("div", "none", only === "flex" ? "No FlexRadio was found on this network. Check it is on and on the same network, then look again."
        : only === "soundcard" ? "No sound card was found. Plug it in and look again, or type its name below."
        : "No sound cards or FlexRadios were found. Type the device below."));
    }
    choices.forEach(function (c) {
      box.appendChild(option(c.id, device === c.device, c.title, c.detail, function () {
        pickRemoved = pickRemoved.concat(M.pickRadio(doc, c));
        edited(true, "pick-" + c.id);
      }, M.radioNote(doc, c)));
    });
    var ubers = !only || only === "ubersdr" ? M.uberChoices(d) : [];
    if (ubers.length === 0 && only === "ubersdr") {
      box.appendChild(el("div", "none", "No list of public receivers could be fetched from here. Look again, or finish setup and type an ubersdr: device in the settings."));
    }
    if (ubers.length > 0) {
      var row = el("div", "field");
      row.appendChild(el("div", "group", only === "ubersdr" ? "Choose a receiver from the public UberSDR list" : "Or listen to a web receiver from the public UberSDR list"));
      var wrap = el("div", "input");
      var pick = el("select");
      pick.id = "uber-pick";
      var none = el("option", null, "Choose a receiver...");
      none.value = "";
      pick.appendChild(none);
      ubers.forEach(function (u) {
        var o = el("option", null, u.title);
        o.value = u.id;
        pick.appendChild(o);
        if (device === u.device) pick.value = u.id;
      });
      pick.addEventListener("change", function () {
        var c = ubers.filter(function (u) { return u.id === pick.value; })[0];
        if (!c) return;
        pickRemoved = pickRemoved.concat(M.pickRadio(doc, c));
        edited(true, "uber-pick");
      });
      wrap.appendChild(pick);
      row.appendChild(wrap);
      var uberNote = el("div", "hint", "Choosing a web receiver removes any push to talk, rig control, sound card mixer, separate sound cards, publishing and identification, and an FM radio kind, which it cannot use.");
      uberNote.id = "uber-note";
      row.appendChild(uberNote);
      box.appendChild(row);
    }
  }

  function paintKeying(box, d) {
    var choices = M.keyingChoices(d, doc);
    var picked = M.keyingPicked(choices, doc);
    if (route() === "setup" && !setup.keying) picked = null;
    var ptt = M.get(doc, "ptt") || {};
    choices.forEach(function (c) {
      var opt = option(c.id, picked === c.id, c.title, c.detail, function () {
        setup.keying = true;
        M.pickKeying(doc, c, {});
        edited(true, "pick-" + c.id);
      });
      if (picked === c.id && c.extra) {
        var extra = el("span", "extra");
        var field = el("span", "field");
        var id = "extra-" + c.id;
        var lab = el("label", null, c.extra === "gpio" ? "GPIO pin" : "Line");
        lab.htmlFor = id;
        field.appendChild(lab);
        var box2 = el("span", "input");
        var sel = el("select");
        sel.id = id;
        var options = c.extra === "gpio"
          ? [["3", "3 (usual)"], ["1", "1"], ["2", "2"], ["4", "4"]]
          : [["rts", "RTS"], ["dtr", "DTR"]];
        options.forEach(function (o) {
          var e = el("option", null, o[1]);
          e.value = o[0];
          sel.appendChild(e);
        });
        var now = c.extra === "gpio" ? String(M.get(ptt, "gpio") || 3) : String(M.get(ptt, "line") || "rts").toLowerCase();
        sel.value = now;
        sel.addEventListener("change", function () {
          setup.keying = true;
          M.pickKeying(doc, c, c.extra === "gpio" ? { gpio: parseInt(sel.value, 10) } : { line: sel.value });
          edited(true, id);
        });
        box2.appendChild(sel);
        field.appendChild(box2);
        extra.appendChild(field);
        opt.appendChild(extra);
      }
      box.appendChild(opt);
    });
  }

  // ---------------------------------------------------------------- the shell
  function render() {
    if (!schema || !doc) return;
    errors = {};
    var at = route();
    lastArea = at;
    var inSetup = at === "setup";
    if (inSetup && !setup.active) enterSetup();
    if (!inSetup && setup.active && setup.phase === "steps") leaveSetup();
    document.body.classList.toggle("setup-mode", inSetup);
    $("mode-word").textContent = inSetup ? "setup" : "settings";
    $("skip-setup").hidden = !(inSetup && setup.phase === "steps");
    $("edit-text").hidden = inSetup;
    if (!(inSetup && (setup.phase === "done" || (setup.phase === "steps" && setup.step === "keying")))) closeStation();
    else openStation();
    $("edit-text").textContent = at === "text" ? "Back to the settings" : "Edit as text";
    $("edit-text").classList.toggle("on", at === "text");
    renderNav();
    renderMain(at);
    paintIssue();
    renderPending();
    drawnShape = shape();
  }

  function present(areaId) {
    // The monitor area is for monitor sites; a station never sees it.
    return areaId !== "monitor" || M.isSet(M.get(doc, "monitor"));
  }

  function issueArea() {
    return check.state === "bad" && check.path ? M.areaOf(schema, check.path) : null;
  }

  function renderNav() {
    var nav = $("nav");
    var at = route();
    nav.textContent = "";
    function link(id, text, count, bad) {
      var a = el("a");
      a.id = "nav-" + id;
      a.href = "#" + id;
      if (at === id) a.className = "on";
      a.appendChild(el("span", null, text));
      if (bad) { var dot = el("span", "dot"); dot.title = "Needs attention"; a.appendChild(dot); }
      else if (count) a.appendChild(el("small", null, String(count)));
      nav.appendChild(a);
    }
    var bad = issueArea();
    link("overview", "Overview");
    schema.areas.forEach(function (a) {
      if (a.id === "advanced" || !present(a.id)) return;
      var n = a.id === "modes" ? ((M.get(doc, "modems") || []).length) : 0;
      link(a.id, a.title, n, bad === a.id);
    });
    nav.appendChild(el("hr"));
    link("advanced", "Advanced", 0, bad === "advanced");
    link("history", "Earlier versions", history.list ? history.list.length : 0);
    link("setup", "Run setup again");
  }

  function renderMain(at) {
    var root = $("form-view");
    root.querySelectorAll("details").forEach(function (d) { if (d.dataset.path) moreOpen[d.dataset.path] = d.open; });
    root.textContent = "";
    var banner = el("div", "issue");
    banner.id = "issue-banner";
    banner.hidden = true;
    root.appendChild(banner);
    if (at === "overview") drawOverview(root);
    else if (at === "history") drawHistory(root);
    else if (at === "text") drawText(root);
    else if (at === "setup") drawSetup(root);
    else drawArea(root, at);
    if (at === "modes" || (at === "setup" && setup.step === "modes" && setup.phase === "steps")) { paintPlan(); schedulePlan(true); }
  }

  // ---------------------------------------------------------------- overview
  function drawOverview(root) {
    root.appendChild(el("h1", null, "Your station"));
    root.appendChild(el("p", "lede", "What this station is set up to do, in one place. Each area opens the settings behind it."));
    schema.areas.forEach(function (a) {
      if (!present(a.id)) return;
      var row = el("div", "area");
      row.id = "overview-" + a.id;
      row.appendChild(el("h2", null, a.title));
      var body = el("div");
      M.summary(schema, doc, a.id).forEach(function (line, i) { body.appendChild(el("p", i === 0 ? null : "sub", line)); });
      row.appendChild(body);
      var change = el("a", "edit", "Change");
      change.id = "change-" + a.id;
      change.href = "#" + a.id;
      row.appendChild(change);
      root.appendChild(row);
    });
  }

  // ---------------------------------------------------------------- an area
  function drawArea(root, areaId) {
    var group = M.areas(schema, doc)[areaId];
    var title = group ? group.title : areaId;
    root.appendChild(el("h1", null, title));
    root.appendChild(el("p", "lede", BLURB[areaId] || ""));
    if (!group) return;
    var all = areaId === "advanced";
    var shown = function (n) { return n.shown; };
    var fields = group.fields.filter(shown);
    var sections = group.sections.filter(shown);
    var basicFields = fields.filter(function (n) { return all || !n.key.advanced; });
    var moreFields = fields.filter(function (n) { return !all && n.key.advanced; });
    var basicSections = sections.filter(function (n) { return all || !n.key.advanced; });
    var moreSections = sections.filter(function (n) { return !all && n.key.advanced; });

    if (basicFields.length === 0 && basicSections.length === 0 && moreFields.length === 0
        && moreSections.length === 0 && group.unknown.length === 0) {
      root.appendChild(el("p", "muted", "Nothing here applies to this station."));
      return;
    }
    var wantsFound = areaId === "radio"
      ? fields.some(function (n) { return n.path === "device"; })
      : areaId === "keying" && sections.some(function (n) { return n.path === "ptt"; });
    if (wantsFound) {
      var box = el("div", "found");
      box.id = "found";
      root.appendChild(box);
      paintFound();
      if (found.state === "idle") look(false);
    }
    if (basicFields.length > 0) root.appendChild(fieldsCard(basicFields));
    basicSections.forEach(function (n) { root.appendChild(drawNode(n)); });
    group.unknown.forEach(function (n) {
      root.appendChild(el("p", "muted", "Not settings this version knows, kept as they are: " + n.names.join(", ")
        + ". Edit as text shows them."));
    });

    if (moreFields.length > 0 || moreSections.length > 0) {
      var more = el("details", "more page");
      more.dataset.path = "more:" + areaId;
      if (moreOpen["more:" + areaId]) more.open = true;
      more.appendChild(el("summary", null, "More settings"));
      var inner = el("div", "inner");
      if (moreFields.length > 0) inner.appendChild(fieldsCard(moreFields));
      moreSections.forEach(function (n) { inner.appendChild(drawNode(n)); });
      more.appendChild(inner);
      root.appendChild(more);
    }
  }

  function fieldsCard(nodes) {
    var card = el("div", "card");
    var body = el("div", "body");
    nodes.forEach(function (n) { body.appendChild(drawNode(n)); });
    card.appendChild(body);
    return card;
  }
