  // Which step a refusal about a setting belongs to.
  function stepFor(path) {
    var area = M.areaOf(schema, path);
    if (area === "radio") return setup.kind === "flex" || setup.kind === "ubersdr" ? "radio" : "card";
    return { keying: "keying", modes: "modes", software: "software" }[area] || null;
  }

  function paintSetupCheck() {
    var status = $("setup-check-status");
    if (!status || setup.step !== "try") return;
    var save = $("setup-save"), chk = $("setup-check"), fix = $("setup-fix");
    var text = "Not checked yet. Press Check to ask the station whether it would start on this.";
    var cls = "";
    if (check.state === "waiting" || check.state === "checking") { text = "Checking..."; }
    else if (check.state === "ok") { text = "Looks good: the station would start on this."; cls = "good"; }
    else if (check.state === "bad") { text = "The station would not start on this: " + check.problem; cls = "bad"; }
    status.textContent = text;
    status.className = cls;
    chk.disabled = check.state === "checking" || busy;
    save.disabled = check.state !== "ok" || busy;
    var step = check.state === "bad" && check.path ? stepFor(check.path) : null;
    fix.hidden = !step;
    if (step) {
      fix.textContent = "Go to " + STEP_TITLE[step];
      fix.onclick = function () { goStep(step); };
    }
  }

  // Asks the station now rather than after the usual pause.
  function checkNow() {
    clearTimeout(checkTimer);
    check = { state: "waiting", seq: check.seq + 1, problem: "", path: null };
    paintSetupCheck();
    runCheck(check.seq);
  }

  // What saving does to this page, for setup: nothing worth saying when it stays at the address
  // it is open at (opening the KISS port to the network leaves the page where it was, at the
  // same host and port), so the restart can be waited for.
  function setupNotice() {
    var move = M.pageMove(loaded, doc, location.hostname, location.protocol);
    if (move && move.kind === "moved" && move.url === location.protocol + "//" + location.host + "/config") return null;
    return pageNotice();
  }

  function saveSetup() {
    // A finished setup always has its KISS port written, even left at the default: that is
    // also what tells it apart from the shipped example, which has none.
    // Only the port: the bind is written when its option is picked, so it was in the document
    // that was checked, and saving never changes it.
    M.set(doc, "kissPort", M.setupKissPort(doc));
    var notice = setupNotice();
    busy = true;
    setup.phase = "saving";
    setup.error = "";
    render();
    post("?persist=true").then(function (r) {
      if (r.status !== 200) {
        busy = false;
        setup.phase = "steps";
        setup.error = M.problemText(r.text);
        render();
        return;
      }
      setup.phase = "restarting";
      // A page that is about to be somewhere else cannot wait on the restart.
      setup.moved = notice;
      render();
      if (!notice) waitForRestart(Date.now(), true);
    }).catch(function (e) {
      busy = false;
      setup.phase = "steps";
      setup.error = "Could not reach the station: " + e.message;
      render();
    });
  }

  function drawSetupWaiting(wrap) {
    wrap.appendChild(el("h1", null, "Starting the station..."));
    var p = el("p", "lede", "Saved. The station is restarting on your settings, which takes a few seconds.");
    p.id = "setup-waiting";
    wrap.appendChild(p);
    if (setup.moved) {
      var n = el("p", "stepnote");
      n.appendChild(setup.moved);
      wrap.appendChild(n);
    }
  }

  // ---- after the restart: the level meter, the key test and the station page
  function drawSetupDone(wrap) {
    wrap.appendChild(el("h1", null, "The station is running"));
    var lede = el("p", "lede", "It is up on your settings and saved to the file.");
    lede.id = "setup-done";
    wrap.appendChild(lede);

    // The meter appears when the station sends a reading, as the station page's does: only a
    // station with a sound card and a way to set levels (an access key, or
    // waterfall.enableAudioControls) sends any, and a Flex or a web receiver never does.
    var card = el("div", "card");
    card.id = "setup-levelbox";
    card.hidden = !station.levelSeen;
    var body = el("div", "body");
    var inner = el("div");
    inner.appendChild(el("b", null, "Input level"));
    var m = el("div", "meter");
    m.id = "setup-meter";
    var zone = el("div", "zone"), hot = el("div", "hot");
    zone.style.left = pct(-18) + "%";
    zone.style.width = (pct(-9) - pct(-18)) + "%";
    hot.style.width = (100 - pct(-6)) + "%";
    var bar = el("div", "bar"), rms = el("div", "rms");
    bar.id = "setup-bar";
    rms.id = "setup-rms";
    [zone, hot, bar, rms].forEach(function (x) { m.appendChild(x); });
    inner.appendChild(m);
    var read = el("div", "levelread", "");
    read.id = "setup-level";
    inner.appendChild(read);
    inner.appendChild(el("p", "stepnote", "Aim for received signals to peak in the green band, -18 to -9 dBFS, and never into the red. With nothing on the channel the bar should sit low."));
    body.appendChild(inner);
    card.appendChild(body);
    wrap.appendChild(card);

    var none = el("p", "stepnote", "No level readings have arrived from this station. Levels are set on the station page, once an access key is set or \"waterfall\".\"enableAudioControls\" is on.");
    none.id = "setup-nolevel";
    none.hidden = station.levelSeen;
    wrap.appendChild(none);

    var gain = el("div", "field");
    gain.id = "setup-gain-row";
    gain.hidden = true;
    var gl = el("label", null, "Sound card input gain");
    gl.htmlFor = "setup-gain";
    gain.appendChild(gl);
    var slider = el("input");
    slider.type = "range";
    slider.id = "setup-gain";
    gain.appendChild(slider);
    var gr = el("div", "levelread");
    gr.id = "setup-gain-read";
    gain.appendChild(gr);
    wrap.appendChild(gain);
    loadGain(slider, gr, gain);

    if (setup.kind !== "ubersdr" && setup.kind !== "other") {
      var box = el("div", "tryit");
      box.id = "keytest";
      wrap.appendChild(box);
      paintKeyTest();
    }
    var links = el("div", "stepnav");
    var st = el("a", "btn primary", "Open the station page");
    st.href = "./";
    st.id = "setup-station-link";
    var more = el("a", "btn", "Go to the settings");
    more.href = "#overview";
    more.id = "setup-settings-link";
    links.appendChild(more);
    links.appendChild(st);
    wrap.appendChild(links);
  }

  function pct(db) { return Math.max(0, Math.min(100, (db + 60) * 100 / 60)); }

  // One reading, on the station page's scale: green -18 to -9, red from -6. The first one shows
  // the meter. A bar is trusted for a second after its last reading, as on the station page
  // (MIX_STALE_MS), and emptied when none comes.
  function paintLevel(m) {
    station.levelSeen = true;
    var box = $("setup-levelbox");
    if (!box) return;
    box.hidden = false;
    $("setup-nolevel").hidden = true;
    var bar = $("setup-bar");
    bar.style.width = pct(m.peak) + "%";
    bar.classList.toggle("loud", !!m.clip || m.peak >= -6);
    bar.classList.toggle("quiet", !m.clip && m.peak < -30);
    $("setup-rms").style.left = pct(m.rms) + "%";
    $("setup-level").textContent = m.peak.toFixed(1) + " dBFS"
      + (m.clip ? ", clipping: turn the input gain down" : m.peak >= -6 ? ", too loud" : m.peak < -30 ? ", quiet" : "");
    clearTimeout(station.stale);
    station.stale = setTimeout(function () {
      var b = $("setup-bar");
      if (b) { b.style.width = "0%"; b.classList.remove("loud", "quiet"); $("setup-level").textContent = "no reading"; }
    }, 1000);
  }

  // The sound card's input gain, from /api/mixer, hidden where the station has no card to mix.
  function loadGain(slider, read, row) {
    api("api/mixer").then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      var c = s && s.available !== false ? s.capture : null;
      if (!c || !c.dbRange || c.decibels === null || c.decibels === undefined) return;
      slider.min = c.dbRange.min;
      slider.max = c.dbRange.max;
      slider.step = 1;
      slider.value = c.decibels;
      read.textContent = Number(c.decibels).toFixed(1) + " dB";
      row.hidden = false;
      slider.addEventListener("change", function () {
        api("api/mixer", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ captureGainDb: Number(slider.value) }) })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (a) { if (a && a.capture && a.capture.decibels !== null) read.textContent = Number(a.capture.decibels).toFixed(1) + " dB"; });
      });
    }).catch(function () { /* no mixer: the meter alone */ });
  }

  $("skip-setup").addEventListener("click", function () {
    // Remembered for this station. The link itself changes the hash, and leaving setup puts the
    // document back as it was (see leaveSetup).
    try { localStorage.setItem(SKIP_STORE, "1"); } catch (e) { /* private mode: asked again next time */ }
  });

  // ---------------------------------------------------------------- edit as text
  function drawText(root) {
    root.appendChild(el("h1", null, "Edit as text"));
    root.appendChild(el("p", "lede", "The whole configuration as JSON, to copy or paste, or to read out when someone is helping you from afar. "
      + "Comments and trailing commas are fine. What you type here is checked like any other change."));
    var bar = el("div");
    bar.id = "json-bar";
    var copy = el("button", "btn small", "Copy");
    copy.type = "button";
    copy.id = "json-copy";
    bar.appendChild(copy);
    root.appendChild(bar);
    var area = el("textarea");
    area.id = "json";
    area.spellcheck = false;
    area.value = JSON.stringify(doc, null, 2);
    root.appendChild(area);
    textInvalid = false;
    area.addEventListener("input", function () {
      try {
        doc = M.parseDocument(area.value);
        textInvalid = false;
        area.classList.remove("invalid");
      } catch (e) {
        textInvalid = true;
        area.classList.add("invalid");
      }
      result("", "");
      scheduleCheck();
    });
    copy.addEventListener("click", function () {
      var text = area.value;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { result("good", "Copied."); });
      } else {
        area.select();
        document.execCommand("copy");
        result("good", "Copied.");
      }
    });
  }

  // ---------------------------------------------------------------- earlier versions
  function kindWords(v) {
    return v.kind === "saved" ? "Saved to the config file"
      : v.kind === "original" ? "How the station was before the first change made here"
      : "Tried until the next restart";
  }

  function getVersion(id) {
    if (history.docs[id]) return Promise.resolve(history.docs[id]);
    return api("api/config/history/" + encodeURIComponent(id)).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
      return r.json();
    }).then(function (v) { history.docs[id] = v; return v; });
  }

  function drawHistory(root) {
    root.appendChild(el("h1", null, "Earlier versions"));
    root.appendChild(el("p", "lede", "Each time a change is applied, the station keeps a copy of it, the last 20. "
      + "Going back to one loads it here as a pending change; you check and apply it like any other."));
    if (history.list === null || history.stale) {
      root.appendChild(el("p", "muted", "Loading..."));
      fetchHistory().then(function () { if (route() === "history") render(); });
      return;
    }
    if (history.list.length === 0) {
      root.appendChild(el("p", "muted", "Nothing yet. A copy is kept each time a change is applied."));
      return;
    }
    history.list.forEach(function (v) {
      var row = el("div", "version");
      row.id = "version-" + v.id;
      var when = el("div", "when");
      when.appendChild(el("span", null, new Date(v.time).toLocaleString()));
      when.appendChild(el("small", null, kindWords(v)));
      if (v.inUse) { var now = el("small", null, "In use now"); now.style.color = "var(--good)"; now.id = "inuse-" + v.id; when.appendChild(now); }
      row.appendChild(when);
      var look = el("div", "look");
      look.hidden = true;
      look.id = "look-body-" + v.id;
      row.appendChild(smallButton("look-" + v.id, "Look", function () {
        if (!look.hidden) { look.hidden = true; return; }
        look.hidden = false;
        look.textContent = "Loading...";
        getVersion(v.id).then(function (full) {
          look.textContent = "";
          var diffs = M.changedLabels(schema, loaded, full.config);
          if ((full.secretsChanged || []).length > 0) {
            var sp = el("p", null, secretSentence(full.secretsChanged));
            sp.id = "look-secrets-" + v.id;
            look.appendChild(sp);
          }
          look.appendChild(el("p", null, diffs.length === 0
            ? "The same as the running configuration."
            : "Differs from the running configuration in " + diffs.length + (diffs.length === 1 ? " setting: " : " settings: ") + diffs.join(", ") + "."));
          look.appendChild(el("pre", null, JSON.stringify(full.config, null, 2)));
        }).catch(function (e) { look.textContent = "Could not read this version: " + e.message; });
      }));
      row.appendChild(smallButton("restore-" + v.id, "Go back to this", function () {
        if (changedCount() > 0 && !confirm("You have changes that are not applied yet. Going back to this version replaces them. Go ahead?")) return;
        getVersion(v.id).then(function (full) {
          doc = clone(full.config);
          restoredFrom = v.id;
          restoredSecrets = full.secretsChanged || [];
          textInvalid = false;
          location.hash = "#overview";
          drawnShape = shape();
          render();
          scheduleCheck();
          if (changedCount() === 0) result("good", "That is the same as the configuration now, so there is nothing to change.");
        }).catch(function (e) { result("bad", "Could not read this version: " + e.message); });
      }));
      row.appendChild(look);
      root.appendChild(row);
    });
  }

  load();
})();
</script>
</body>
</html>
