name: package upgrades

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: package-upgrades
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: [self-hosted, Linux, X64]
    # The bump restores several times and the security pass repeats the build, so this is wider than CI.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check the tools this job needs
        run: scripts/ci-require-tools.sh dpkg-deb:dpkg readelf:binutils iconv:libc-bin gzip
      - name: Check libasound if this runner has sound hardware
        run: |
          if compgen -G '/dev/snd/pcmC*c' > /dev/null; then scripts/ci-require-tools.sh lib:libasound.so.2:libasound2t64/libasound2; fi
      - name: Upgrade, build and test
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump-packages.py pdn-soundmodem.slnx | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet restore --no-http-cache
          dotnet build --configuration Release --no-restore
          # Browser for the configuration page tests. Fetched here, after the bump, because the Playwright pin may have just moved.
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright"
          dotnet run --artifacts-path "$RUNNER_TEMP/install-playwright-browser" --file scripts/install-playwright-browser.cs
          mkdir -p "$RUNNER_TEMP/browser-libs/root"
          while IFS= read -r line; do export "$line"; done < <(scripts/browser-libs.sh "$RUNNER_TEMP/browser-libs")
          dotnet test --configuration Release --no-build -- --filter-not-trait "Category=Aspiration" --filter-not-trait "Category=Quarantine"
      - name: Security pass (only when the full upgrade failed)
        id: security
        if: steps.full.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          # Drop the failed attempt's edits so the security pass starts from the committed tree.
          git reset --hard
          git clean -fdx -e .dotnet
          python3 scripts/bump-packages.py pdn-soundmodem.slnx --vulnerable-only | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet restore --no-http-cache
          dotnet build --configuration Release --no-restore
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright"
          dotnet run --artifacts-path "$RUNNER_TEMP/install-playwright-browser" --file scripts/install-playwright-browser.cs
          mkdir -p "$RUNNER_TEMP/browser-libs/root"
          while IFS= read -r line; do export "$line"; done < <(scripts/browser-libs.sh "$RUNNER_TEMP/browser-libs")
          dotnet test --configuration Release --no-build -- --filter-not-trait "Category=Aspiration" --filter-not-trait "Category=Quarantine"

      - name: Commit and push on a green build
        if: success()
        shell: bash
        env:
          SUBJECT: "${{ steps.full.outcome == 'failure' && 'chore(deps): security package fixes' || 'chore(deps): package upgrades' }}"
        run: |
          set -euo pipefail
          # Untracked build leftovers are not changes; the script only edits tracked files.
          if [ -z "$(git status --porcelain --untracked-files=no)" ]; then
            echo "nothing to upgrade"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          {
            echo "$SUBJECT"
            echo
            echo "Package versions changed by scripts/bump-packages.py:"
            cat "$RUNNER_TEMP/upgrades.txt"
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git pull --rebase origin main
          git push origin HEAD:main
