name: release

# The release pipeline for a `v*` tag: test, then build the pdn-soundmodem NuGet package
# (modem core library), the @packet-net/soundmodem npm package (the same core compiled to
# WebAssembly, for the browser) and the .deb packages (daemon + systemd unit) for
# amd64/arm64/armhf, attach them to a GitHub Release, and push to nuget.org and npmjs.com.
#
# All three carry the same version, from the same tag, built from the same commit: a station
# on a browser page and a station on a Debian box are then provably running the same modem.
#
# workflow_dispatch runs build everything and leave it as workflow artifacts without
# releasing anything - a full dry run of the pipeline. Set `publish: true` to also cut the
# GitHub Release and push to NuGet and npm.
#
# Runs as a single job on purpose: the runner is self-hosted and memory-bounded, so the
# three self-contained publishes go one at a time, and keeping them in one job avoids
# shuttling ~75 MB artifacts between jobs to do it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.7.0 or 0.7.0-rc1)'
        required: true
      publish:
        description: 'Also cut the GitHub Release and push to NuGet'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    # A normal run is about 11 minutes; 40 leaves headroom for three architectures and the
    # asset uploads while still catching a wedge on the same shared self-hosted runner.
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes are written from first-parent history between tags

      # The xUnit v3 / MTP test apphosts (OutputType=Exe) resolve the runtime via
      # DOTNET_ROOT; the runner's distro dotnet lives outside the apphost's default
      # search paths, so register it explicitly or every test invocation dies with
      # "You must install .NET". Same fix as ci.yml.
      - name: Register .NET root for MTP apphosts
        run: echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"

      - name: Preflight
        run: |
          # dpkg-deb ships in the Essential `dpkg` package, so this only trips if the
          # runner is not Debian-family - in which case it cannot build .debs at all.
          command -v dpkg-deb >/dev/null || {
            echo "::error::dpkg-deb is missing - this job needs a Debian-family runner"
            exit 1
          }
          command -v gh >/dev/null || { echo "::error::gh CLI is missing on this runner"; exit 1; }
          # The npm package is built here too, which needs Node for the type declarations
          # and the pack. Fail in preflight rather than 20 minutes in.
          command -v npm >/dev/null || {
            echo "::error::npm is missing - this job builds @packet-net/soundmodem"
            exit 1
          }

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::no version (tag v* or the version input is required)"
            exit 1
          fi
          # Debian is stricter than SemVer: a version must start with a digit.
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::version '$version' must start with a digit"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # A hyphen means a SemVer prerelease (0.7.0-rc1); mark the release accordingly.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Restore past the HTTP cache. This runner is self-hosted and keeps its NuGet cache
      # between jobs forever, so a dependency published minutes ago is invisible to it while
      # nuget.org already serves the package - which is every release that bumps a dependency
      # we just cut. An ephemeral runner never sees this; ours would see it every time.
      - name: Restore (bypassing the NuGet HTTP cache)
        run: dotnet restore --no-http-cache

      # Same suite that wedged; same step-level timeout as ci.yml's Test step.
      - name: Test
        timeout-minutes: 30
        run: dotnet test --configuration Release --no-restore -- --filter-not-trait "Category=Aspiration"

      # Same reason as ci.yml: the runner prints only "Failed: N" and writes the names to a
      # UTF-16 log on the runner that nobody downstream ever sees. A release that refuses to
      # publish is the pipeline working - but it has to say what it refused over.
      - name: Name the failures
        if: failure()
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            echo "::group::$(basename "$f")"
            # Failures first and in full - see the same step in ci.yml for why a head -200 of
            # the whole log shows nothing but skips.
            log="$(iconv -f UTF-16LE -t UTF-8 "$f" 2>/dev/null || cat "$f")"
            # MTP writes ANSI colour codes into the log; the per-test "failed <name>" lines
            # start with an escape sequence, so an unstripped ^failed grep names nothing -
            # measured on the v0.26.0 release run, which failed a test and could not say which.
            log="$(sed 's/\x1b\[[0-9;]*m//g' <<<"$log")"
            grep -A 6 -E "^failed |^\s+failed " <<<"$log" | head -120 || true
            echo "--- tail ---"
            grep -vE "^\s*$" <<<"$log" | tail -40
            echo "::endgroup::"
          done < <(find tests -path '*/TestResults/*.log' -newermt '-30 minutes' 2>/dev/null)
          [ "$found" = 1 ] || echo "::warning::no TestResults log found to report"

      - name: Pack NuGet package
        run: |
          dotnet pack src/Packet.SoundModem/Packet.SoundModem.csproj \
            --configuration Release \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      # The browser modem. AOT is the shipped build: the download is 2.8 MB gzipped against
      # 1.4 MB for the interpreter, paid once and cached, and it buys roughly 3.5x the CPU
      # headroom on every station for ever - which matters most on the phones and the slow
      # modes. The workload install is a no-op once the runner has it.
      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Build and pack the npm package
        run: |
          set -euo pipefail
          web/build.sh --aot
          # cd rather than --prefix: `npm pkg` and `npm pack` read the manifest from the
          # working directory on some npm versions whatever --prefix says, and this runner is
          # one of them - it went looking for a package.json at the repository root and the
          # release stopped there, after the WebAssembly build had already succeeded.
          artifacts="$PWD/artifacts"
          version="${{ steps.version.outputs.version }}"
          ( cd web/package && npm pkg set version="$version" && npm pack --pack-destination "$artifacts" )

      # The bundle's boot config names every asset the loader will fetch, and a missing one
      # is fatal at start-up rather than a lost debug aid. So check the tarball against that
      # manifest here, where it is still cheap to fix - not from a bug report saying the page
      # never loads.
      - name: Verify the npm package is complete
        run: |
          work="$(mktemp -d)"
          tar xzf ./artifacts/packet-net-soundmodem-*.tgz -C "$work"
          missing=0
          for asset in $(grep -oE '"[A-Za-z0-9_.\-]+\.(wasm|js|symbols|dat)"' \
                          web/package/_framework/dotnet.boot.js | tr -d '"' | sort -u); do
            if [ ! -f "$work/package/_framework/$asset" ]; then
              echo "::error::the npm package is missing $asset, which its boot config requires"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          modes=$(cd "$work/package" && node --input-type=module -e "
            import { dotnet } from './_framework/dotnet.js'
            const rt = await dotnet.withDiagnosticTracing(false).create()
            const M = (await rt.getAssemblyExports(rt.getConfig().mainAssemblyName)).Modem
            console.log(M.Modes().length)
          " | tail -1)
          [ "${modes:-0}" -gt 0 ] || { echo "::error::the packed bundle does not load"; exit 1; }
          echo "packed bundle loads, $modes modes"

      - name: Build .deb packages
        run: |
          set -euo pipefail
          # Pin the changelog date to the commit being built so a rebuild of a tag is
          # byte-identical. %ct is always a Unix timestamp, unlike the event payload's
          # pushed_at, which is an integer for push events and an ISO string elsewhere.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for arch in amd64 arm64 armhf; do
            echo "::group::deb $arch"
            packaging/build-deb.sh "${{ steps.version.outputs.version }}" "$arch" ./artifacts
            echo "::endgroup::"
          done

      - name: Verify .deb contents
        run: |
          set -euo pipefail
          for deb in ./artifacts/*.deb; do
            echo "::group::$(basename "$deb")"
            dpkg-deb --info "$deb"
            # Capture the listing once and match it in memory. Piping dpkg-deb straight
            # into `grep -q` makes grep close the pipe the moment it matches, and the
            # SIGPIPE dpkg-deb takes for that becomes a pipeline failure under pipefail.
            listing="$(dpkg-deb --contents "$deb")"
            echo "$listing"
            # A package that ships no unit file is not the package we meant to ship.
            grep -q 'usr/lib/systemd/system/pdn-soundmodem\.service$' <<<"$listing"
            grep -q 'usr/lib/pdn-soundmodem/pdn-soundmodem$' <<<"$listing"
            grep -q 'usr/bin/pdn-soundmodem ->' <<<"$listing"
            # postinst seeds the config from this path; if it moves, install breaks.
            grep -q 'usr/share/pdn-soundmodem/soundmodem\.example\.json$' <<<"$listing"
            # Serial PTT dies with DllNotFoundException if this shim is missing.
            grep -q 'usr/lib/pdn-soundmodem/libSystem\.IO\.Ports\.Native\.so$' <<<"$listing"
            echo "::endgroup::"
          done

      - name: Checksums
        working-directory: ./artifacts
        run: |
          sha256sum *.deb *.nupkg *.tgz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: pdn-soundmodem-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.deb
            artifacts/*.nupkg
            artifacts/*.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error

      - name: GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # One bullet per merged PR (or direct commit) since the previous tag, grouped by
          # kind, from first-parent history - no rehashed install text, no API calls. The
          # install pointer is a single line at the end; INSTALL.md carries the detail.
          python3 scripts/release-notes.py "$TAG" > /tmp/relnotes.md
          cat /tmp/relnotes.md

          prerelease=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - replacing its assets and notes"
            gh release upload "$TAG" ./artifacts/*.deb ./artifacts/*.nupkg ./artifacts/*.tgz ./artifacts/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file /tmp/relnotes.md
          else
            gh release create "$TAG" \
              ./artifacts/*.deb ./artifacts/*.nupkg ./artifacts/*.tgz ./artifacts/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "pdn-soundmodem $VERSION" \
              --notes-file /tmp/relnotes.md \
              $prerelease
          fi

      - name: Push to nuget.org
        if: steps.version.outputs.publish == 'true' && env.NUGET_API_KEY != ''
        run: |
          set -euo pipefail
          dotnet nuget push "./artifacts/pdn-soundmodem.${{ steps.version.outputs.version }}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate
          if [ -f "./artifacts/pdn-soundmodem.${{ steps.version.outputs.version }}.snupkg" ]; then
            dotnet nuget push "./artifacts/pdn-soundmodem.${{ steps.version.outputs.version }}.snupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${NUGET_API_KEY}" \
              --skip-duplicate || \
              echo "::warning::snupkg push failed; main nupkg still uploaded."
          fi

      - name: Warn if NUGET_API_KEY missing
        if: steps.version.outputs.publish == 'true' && env.NUGET_API_KEY == ''
        run: echo "::warning::NUGET_API_KEY is not visible to this repo - NuGet push skipped (the GitHub Release still has the .debs). Grant the org secret access to pdn-soundmodem."

  # The npm leg is split out onto a GitHub-hosted runner, which is a DELIBERATE
  # EXCEPTION to the self-hosted-only rule and the only one in this repo. npm
  # refuses a provenance attestation built anywhere else ("Unsupported GitHub
  # Actions runner environment: self-hosted"), and trusted publishing generates
  # provenance by default. The release job above cannot move: it needs the .NET
  # wasm workload and builds three .deb architectures. So it hands the already
  # built tarball over as an artifact and this job does nothing but publish it.
  # Same commit, same workflow run, so the attestation still describes the build
  # it came from.
  publish-npm:
    name: publish @packet-net/soundmodem to npmjs.com
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing (OIDC), configured at the npmjs end against
    # packet-net/pdn-soundmodem + this workflow file. No NPM_TOKEN: the runner
    # mints a short-lived id-token per run, so there is no secret to expire.
    # The old token had, which is what prompted this (packet-net/ax25sdl#83).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: ensure an npm that speaks trusted publishing
        # Trusted publishing needs npm >= 11.5.1. Pin the CLI forward rather
        # than inheriting whatever the node image bundles.
        run: |
          npm install -g npm@latest
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: pdn-soundmodem-${{ needs.release.outputs.version }}
          path: artifacts

      - name: publish
        run: |
          set -euo pipefail
          # The ./ is load-bearing. Without it npm reads a path containing a
          # slash as a GitHub shorthand spec and tries to FETCH it:
          #   npm error code EALLOWGIT
          #   Refusing to fetch "github:artifacts/packet-net-soundmodem-0.63.0.tgz"
          # which is what broke the v0.63.0 publish.
          tgz="./artifacts/packet-net-soundmodem-${{ needs.release.outputs.version }}.tgz"
          test -f "$tgz" || { echo "::error::$tgz missing from the release artifact"; exit 1; }
          # --access public because a scoped package is private by default and a
          # first publish is refused without it; harmless on every one after.
          npm publish "$tgz" --access public
