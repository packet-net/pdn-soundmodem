name: pages

# Serves one page: a redirect to where the browser station now lives.
#
# It used to build and publish that station, which lived at web/demo in this repository. It moved
# to packet-net/pdn-web on 2026-09-17, where it sits beside the other browser apps and is an
# ordinary consumer of the published @packet-net/soundmodem rather than a page wired into the
# modem's own build. What is left here is the old URL, which was published and linked, kept
# working.
#
# Nothing re-pins a version any more either. The page asks jsDelivr for the newest 0.x of the
# package rather than naming a release, so a release reaches it without a workflow, a token or a
# dispatch across two repositories.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # GitHub-hosted, as it was: this job copies one static file and needs nothing that makes the
    # self-hosted runners ours. See CLAUDE.md for where that line sits.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build the redirect
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          # A meta refresh and a canonical link rather than an HTTP redirect, because GitHub Pages
          # serves static files and has no way to send a 301. The link is spelled out in the body
          # as well: a refresh that is blocked, or a reader who arrives with scripting off, still
          # gets somewhere to click.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Moved to pdn-web</title>
          <link rel="canonical" href="https://packet-net.github.io/pdn-web/soundmodem-web/">
          <meta http-equiv="refresh" content="0; url=https://packet-net.github.io/pdn-web/soundmodem-web/">
          <style>
            :root { color-scheme: dark; }
            body { margin:0; padding:40px 24px; background:#101418; color:#d6e0ea;
                   font:15px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
            main { max-width:620px; margin:0 auto; }
            a { color:#93c5fd; }
          </style>
          </head>
          <body><main>
            <h1>The browser station has moved</h1>
            <p>It lives at
               <a href="https://packet-net.github.io/pdn-web/soundmodem-web/">packet-net.github.io/pdn-web/soundmodem-web/</a>
               now, in <a href="https://github.com/packet-net/pdn-web">packet-net/pdn-web</a>
               alongside the other browser apps.</p>
            <p>You should be sent there automatically.</p>
          </main></body>
          </html>
          HTML
          cat _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
